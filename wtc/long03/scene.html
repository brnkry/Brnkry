svg{position:absolute;inset:0}
.mic{font-family:"WTC";font-weight:700;font-stretch:90%;letter-spacing:.06em}
.bold{font-family:"WTC";font-weight:800;font-stretch:75%}
.ink{fill:var(--ink)} .acc{fill:var(--acc)} .card{fill:var(--card)} .bgf{fill:var(--bg)} .mut{fill:var(--muted)} .lin{fill:var(--line)} .red{fill:var(--red)}
.sInk{stroke:var(--ink)} .sAcc{stroke:var(--acc)} .sMut{stroke:var(--muted)} .sLine{stroke:var(--line)} .sBg{stroke:var(--bg)}
