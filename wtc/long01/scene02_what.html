el('rect',{x:-48,y:-34,width:96,height:68,rx:10,fill:'#0E0E12',stroke:LIME,'stroke-width':5},ecu);
[-30,-10,10,30].forEach(x=>{el('rect',{x:x-3,y:-46,width:6,height:12,fill:LIME},ecu);el('rect',{x:x-3,y:34,width:6,height:12,fill:LIME},ecu)});

window.render=function(t){
 renderCaptions(t);flash.style.opacity=0;
 // narrator
 {const pz=poseAt(t);const m=mouthAt(t);let smile=.55,bw=0,bu=.1+.25*m;

 // ---- S1: lamp, official name, nickname ----
 {const v=V(t,-1,T_CAR,.01,.3);show(v,s1);if(v>0){
  tr(s1,1300,330,1,0,v);bigLamp.set(0);bigLamp.setAttribute('transform',`scale(${.9*back(P(t,0,.45))})`);

  const tn=W_('a2','malfunction')-.1;const nm='MALFUNCTION INDICATOR LAMP';offName.textContent=nm.slice(0,Math.round(nm.length*eo(P(t,tn,1.6))));

  nickSub.style.opacity=eo(P(t,tc+.5,.3));nickSub.setAttribute('transform',`translate(0 ${-30*up})`)}}

 // ---- S2: X-ray car ----
 {const v=V(t,T_CAR,T_CLU,.4,.35);show(v,xr,ecuCall,ecuLine,emLab,code,...chips);if(v>0){

  const tl=W_('a3','ECU')-.2;const ck=back(P(t,tl,.4));tr(ecuCall,1140,110,ck,0,Math.min(v,cl(P(t,tl,.15))));

  // chip values

  // emissions puffs
  const tm=W_('a9','emissions')-.4;puffs.forEach((p,i)=>{const q=((t*.7+i/7)%1);const on=t>tm&&t<T_CLU;p.setAttribute('cx',40-q*240);p.setAttribute('cy',300-q*60+10*Math.sin(t*2+i));p.setAttribute('r',10+46*q);p.setAttribute('opacity',on?.55*(1-q)*cl(P(t,tm,.6)):0)});

 {const a=W_('a10','light')-.3;const v=t>a&&t<T_CLU+.3;show(v?1:0,lampOn);if(v){const lb=lampBlink(t,[T_ON]);lampOn.set(lb);

 {const v=V(t,T_CLU,99,.4,.3);show(v,s3);if(v>0){
