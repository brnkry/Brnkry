<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Hand;src:url(fonts/hand.woff2)}@font-face{font-family:Marker;src:url(fonts/marker.woff2)}
html,body{margin:0}#stage{position:relative;overflow:hidden;background:#F6F2E8}
.big{position:absolute;font-family:Marker,'Noto Color Emoji';color:#E0353B;-webkit-text-stroke:10px #1B1B1F;paint-order:stroke fill;line-height:.9;text-shadow:0 10px 0 #1B1B1F;white-space:nowrap}
.card{position:absolute;background:#fff;border:7px solid #1B1B1F;border-radius:34px;font-family:Hand,'Noto Color Emoji';color:#1B1B1F;box-shadow:10px 12px 0 rgba(0,0,0,.18)}
.card .u{color:#8C8A84}.card .h{position:absolute;right:26px;bottom:18px;color:#E0353B}
.bg{position:absolute}
</style></head><body><div id="stage"></div><script>
// Reply Guys thumbnail template. usage: thumb.html#<path to episode thumb cfg.js>|wide  or  |tall
// cfg.js sets window.TH={bg, big1, big2, user, text, likes}
const [cfg,m]=decodeURIComponent(location.hash.slice(1)).split('|');const s=document.createElement('script');s.src=cfg;s.onload=build;document.body.appendChild(s);
function build(){const C=window.TH,st=document.getElementById('stage');const add=h=>st.insertAdjacentHTML('beforeend',h);
  const card=(x,y,w,fs,pad)=>`<div class="card" style="left:${x}px;top:${y}px;width:${w}px;padding:${pad}px ${pad+8}px ${pad*2.4}px;font-size:${fs}px;transform:rotate(-3deg)"><div class="u" style="font-size:${fs*.68}px">${C.user}</div>${C.text}${C.likes?`<div class="h" style="font-size:${fs*.72}px">♥ ${C.likes}</div>`:''}</div>`;
  if(m==='wide'){st.style.width='1280px';st.style.height='720px';
    add(`<div class="bg" style="left:0;top:0;width:1280px;height:720px;background:url(${C.bg}) 335px -560px/918px 1632px no-repeat"></div>`);
    add(`<div class="big" style="left:36px;top:34px;font-size:${C.size1||130}px;transform:rotate(-5deg)">${C.big1}</div>`);
    add(`<div class="big" style="left:56px;top:${C.size1?C.size1+44:174}px;font-size:${C.size2||96}px;color:#fff;transform:rotate(-5deg)">${C.big2}</div>`);
    add(card(36,450,380,38,20));
  }else{st.style.width='1080px';st.style.height='1920px';
    add(`<div class="bg" style="left:0;top:0;width:1080px;height:1920px;background:url(${C.bg}) 0 0/1080px 1920px"></div>`);
    add(`<div class="big" style="left:0;width:1080px;text-align:center;top:330px;font-size:${(C.size1||130)*1.25}px;transform:rotate(-4deg)">${C.big1}</div>`);
    add(`<div class="big" style="left:0;width:1080px;text-align:center;top:${330+(C.size1||130)*1.25+20}px;font-size:${(C.size2||96)*1.3}px;color:#fff;transform:rotate(-4deg)">${C.big2}</div>`);
    add(card(170,690,700,54,26));}
  document.fonts.load('40px Marker').then(()=>document.fonts.load('40px Hand')).then(()=>{window.__done=true})}
</script></body></html>
