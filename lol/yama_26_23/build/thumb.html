<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
@font-face{font-family:PB;src:url(assets/fonts/punkboy_bi.otf)}
@font-face{font-family:Mon;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;background:transparent;overflow:hidden}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:PB;color:#F4EFE6}
.ab{position:absolute}
:root{--lime:#D4FF3A;--red:#FF3B5C;--paper:#F4EFE6;--ink:#0B0B0F}
/* Turkish letters the font lacks, built from its own pieces */
.ti{position:relative;display:inline-block;line-height:.9}
.ti.dot:after{content:'';position:absolute;left:54%;bottom:1.0em;width:.19em;height:.16em;background:currentColor;border-radius:40% 55% 45% 50%;transform:translateX(-50%) rotate(-12deg)}
.ti.brv:after{content:'';position:absolute;left:54%;bottom:.92em;width:.4em;height:.17em;border:.1em solid currentColor;border-top:0;border-radius:0 0 .3em .3em;transform:translateX(-50%) rotate(-8deg)}
.ti.ced:after{content:'Ç';position:absolute;left:0;right:0;top:0;text-align:center;clip-path:inset(86% -20% -80% -20%);transform:translateX(-.02em)}
.ti.pd{width:.24em;height:.8em}.ti.pd:not(:has(i)):after{content:'';position:absolute;left:.08em;bottom:.04em;width:.17em;height:.16em;background:currentColor;border-radius:45% 55% 50% 40%;transform:rotate(-10deg)}
.pc{font-family:Mon;font-weight:900;font-size:.78em;margin-right:.04em}

body{margin:0;background:#000}
.th{position:relative;width:1280px;height:720px;overflow:hidden;font-family:PB;color:#F4EFE6;background:#0B0B0F}
.sp{position:absolute;top:0;height:720px;background-size:cover}
.ink{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,15,0) 0,rgba(11,11,15,.15) 30%,rgba(11,11,15,.82) 44%,rgba(11,11,15,.82) 56%,rgba(11,11,15,.15) 70%,rgba(11,11,15,0) 100%)}
.c{position:absolute;left:0;right:0;text-align:center}
.st{position:absolute;font-size:62px;padding:2px 20px 4px;border:7px solid currentColor;border-radius:12px;background:rgba(244,239,230,.92);letter-spacing:.05em}
.pn{position:absolute;overflow:hidden;background-repeat:no-repeat}
.pn:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
</style></head><body>
<div class="th" id="t">
 <div style="position:absolute;inset:-30px;background:url(assets/splash_Azir.jpg) center/cover;filter:blur(10px) brightness(.35) saturate(1.2)"></div>
 <div class="pn" style="left:0;top:0;width:470px;height:380px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);background-image:url(assets/splash_Ezreal.jpg);background-size:1580px auto;background-position:-744px -114px"></div>
 <div class="pn" style="left:0;top:372px;width:440px;height:348px;clip-path:polygon(0 2%,100% 0,92% 100%,0 100%);background-image:url(assets/splash_Bard.jpg);background-size:1460px auto;background-position:-700px -90px"></div>
 <div class="pn" style="right:0;top:0;width:480px;height:720px;clip-path:polygon(9% 0,100% 0,100% 100%,0 100%);background-image:url(assets/splash_Syndra.jpg);background-size:1820px auto;background-position:-660px -10px"></div>
 <div style="position:absolute;left:0;top:368px;width:450px;height:10px;background:#D4FF3A;transform:rotate(-1deg)"></div>
 <div style="position:absolute;left:370px;top:96px;width:540px;transform:rotate(-3deg);text-align:center">
  <div style="background:#D4FF3A;color:#0B0B0F;padding:20px 0 0;box-shadow:14px 16px 0 rgba(0,0,0,.65)">
   <div style="font-size:92px;line-height:1">YAMA</div>
   <div style="font-size:200px;line-height:1.22;letter-spacing:.03em;margin-top:6px">26<span style="position:relative;display:inline-block;width:.26em;height:.8em"><i style="position:absolute;left:-.02em;bottom:.02em;width:.17em;height:.16em;background:currentColor;border-radius:45% 55% 50% 40%;transform:rotate(-10deg)"></i></span>23</div>
   <div id="h" style="background:#0B0B0F;color:#F4EFE6;font-size:50px;line-height:1.35;padding:14px 0 6px;letter-spacing:.02em;white-space:nowrap"></div>
  </div>
 </div>
 <div class="st" style="left:286px;top:612px;color:#7FB800;transform:rotate(-10deg);font-size:50px">BUFF</div>
 <div class="st" style="right:34px;top:604px;color:#E0193F;transform:rotate(9deg);font-size:54px">NERF</div>
 <div style="position:absolute;left:0;right:0;top:668px;text-align:center"><span style="display:inline-flex;align-items:center;gap:10px;padding:5px 16px 5px 6px;background:rgba(11,11,15,.85);border-radius:30px"><img src="assets/logo.png" style="width:38px;height:38px;border-radius:50%"><span style="font-size:28px;letter-spacing:.06em;color:#F4EFE6">FEEDLEME HOCAM</span></span></div>
</div>
<script>const tr=s=>String(s).replace(/İ/g,'<span class="ti dot">I</span>').replace(/Ğ/g,'<span class="ti brv">G</span>').replace(/Ş/g,'<span class="ti ced">S</span>').replace(/\./g,'<span class="ti pd">&#8203;</span>').replace(/%/g,'<span class="pc">%</span>');
document.getElementById('h').innerHTML=tr('TÜM DEĞİŞİKLİKLER');</script></body></html>
