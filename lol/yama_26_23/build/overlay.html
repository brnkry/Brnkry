.ti.pd{width:.24em;height:.8em}.ti.pd:after{content:'';position:absolute;left:.08em;bottom:.04em;width:.17em;height:.16em;background:currentColor;border-radius:45% 55% 50% 40%;transform:rotate(-10deg)}

.dotc{position:absolute;border:5px solid var(--paper);background:#000;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.dotc img{display:block;width:100%;height:100%}

.ban{position:absolute;left:-60px;right:-60px;text-align:center;color:var(--ink);font-size:var(--fs,150px);line-height:1;padding:46px 0 30px}
.big{position:absolute;left:0;right:0;text-align:center;font-size:150px;line-height:1;text-shadow:0 10px 0 rgba(0,0,0,.6),0 0 40px rgba(0,0,0,.6)}

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,prog=(t,a,d)=>cl((t-a)/d);

const jit=(i,a=1)=>Math.sin(i*12.9898)*a; // stable pseudo random tilt

const STRIP=CH.filter(c=>c.id!=='item');
function card(c,t,seg){const k=prog(t,seg.a-.05,.35),o=1-prog(t,seg.b-.25,.25);if(o<=0)return '';
 const col=c.ty==='buff'?'#7FB800':'#E0193F',hl=c.ty==='buff'?'var(--lime)':'#FF9EB0';

 let h=`<div class="cardw" style="opacity:${cl(k*3)*o};transform:translate(${(1-eo(k))*-140+sh}px,${(1-eo(k))*40+sh*.6}px) rotate(${lerp(-6,-1.2,eo(k))}deg)"><div class="card">`;
 let ic='';

 h+=`<div class="txt"><div class="nm">${tr(c.nm)}</div><div class="sp">`+c.sp.map((x,i)=>`<div style="display:flex;align-items:center;gap:14px;margin-right:18px">${x.k?`<div class="key">${x.k}</div>`:''}<div class="skn">${tr(x.n)}</div></div>`).join('')+`</div>`;
 c.rows.forEach((r,i)=>{const rt=seg.rows[i]??seg.a+.4+i*.5,q=prog(t,rt,.25);if(q<=0)return;const s=eo(prog(t,rt+.15,.35)),nk=r[3]==='n';

function strip(t,cur,sa){// stickers, top right; current one big
 let h='';const n=STRIP.length,ci=STRIP.findIndex(c=>c.id===cur);
 STRIP.forEach((c,i)=>{const on=i===ci,past=ci>=0&&i<ci;const g=on?eb(prog(t,sa,.4)):0;const sz=lerp(78,150,g);const x=1920-40-(n-i)*86-40*g+(i>ci&&ci>=0?72*eo(prog(t,sa,.4)):0),y=lerp(46,34,g);
