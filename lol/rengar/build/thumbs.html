<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Ant;src:url(node_modules/@fontsource/anton/files/anton-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+0130-0131,U+015E-015F,U+011E-011F}

html,body{margin:0;background:#000}
.th{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Ant;color:#FFF8EC}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.t{position:absolute;text-transform:uppercase;line-height:1.18;letter-spacing:.01em;text-shadow:0 7px 0 #000,0 0 34px rgba(0,0,0,.85)}
.y{color:#FFC23D}.r{color:#FF3B4E}
.clock{position:absolute;display:flex;align-items:center;gap:14px;padding:16px 34px 16px 26px;background:linear-gradient(180deg,#0f2235,#010A13);border:4px solid #C8AA6E;outline:3px solid rgba(200,170,110,.35);outline-offset:6px;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);box-shadow:0 0 40px rgba(10,200,185,.35) inset}
.b4{font-family:Ant;font-size:190px;line-height:.9;color:#FFC23D;transform:skewX(-12deg);text-shadow:6px 7px 0 #000,0 0 30px rgba(0,0,0,.8);margin:-46px 0 -26px;padding-right:10px}
.lab{display:flex;flex-direction:column;line-height:1.05}
.lab b{font-family:Ant;font-weight:400;font-size:66px;line-height:1.15;color:#FFC23D;text-shadow:0 6px 0 #000;letter-spacing:.02em}
.lab i{font-family:Osw;font-style:normal;font-weight:700;font-size:28px;letter-spacing:.22em;color:#0AC8B9}
.ic{position:absolute;border:4px solid #C8AA6E;box-shadow:0 10px 30px rgba(0,0,0,.6)}
</style></head><body>
