<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
<defs>
 <radialGradient id="blue" cx="60%" cy="55%" r="65%"><stop offset="0" stop-color="#E8FBFF"/><stop offset=".3" stop-color="#8FE3FF"/><stop offset=".65" stop-color="#2A8CFF"/><stop offset="1" stop-color="#0B2E7A"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".35" stop-color="#FFC94A"/><stop offset=".7" stop-color="#C8811C"/><stop offset="1" stop-color="#6E3F0C"/></linearGradient>
 <radialGradient id="smudge"><stop offset="0" stop-color="#05070d" stop-opacity=".95"/><stop offset=".6" stop-color="#0a0f1c" stop-opacity=".7"/><stop offset="1" stop-color="#0a0f1c" stop-opacity="0"/></radialGradient>
 <filter id="glowB" x="-60%" y="-90%" width="220%" height="280%"><feGaussianBlur stdDeviation="20" result="b"/><feFlood flood-color="#3AA8FF"/><feComposite in2="b" operator="in" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glowG" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16" result="b"/><feFlood flood-color="#FF9A1F"/><feComposite in2="b" operator="in" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
 <filter id="fur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<!-- dark fur smudges behind each eye -->
<ellipse cx="270" cy="200" rx="230" ry="120" fill="url(#smudge)" filter="url(#fur)"/>
<ellipse cx="730" cy="200" rx="230" ry="130" fill="url(#smudge)" filter="url(#fur)"/>
<!-- left eye: glowing blue, slanted, slit pupil -->
<g filter="url(#glowB)">
 <path d="M90 150 C 170 110, 300 120, 420 255 C 300 250, 170 225, 90 150 Z" fill="url(#blue)"/>
</g>
<ellipse cx="300" cy="196" rx="9" ry="38" transform="rotate(-28 300 196)" fill="#06203f" filter="url(#soft)"/>
<!-- right eye: golden X scar (the eye Kha'Zix took), tapered blades -->
<g filter="url(#glowG)">
 <path d="M600 92 L 711 216 L 852 304 L 739 179 Z" fill="url(#gold)"/>
 <path d="M852 98 L 714 180 L 603 298 L 741 215 Z" fill="url(#gold)"/>
</g>
<path d="M612 104 L 840 292" stroke="#FFF8DA" stroke-width="3" stroke-linecap="round" opacity=".65"/>
<path d="M840 110 L 615 287" stroke="#FFF8DA" stroke-width="3" stroke-linecap="round" opacity=".5"/>
</svg>
