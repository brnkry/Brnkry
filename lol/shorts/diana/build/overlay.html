@font-face{font-family:Mon;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-ext-900-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+0130-0131,U+015E-015F,U+011E-011F}
@font-face{font-family:Mon;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2')}

.ab{position:absolute}

<script>const tr=s=>String(s).replace(/İ/g,'<span class="ti dot">I</span>').replace(/Ğ/g,'<span class="ti brv">G</span>').replace(/Ş/g,'<span class="ti ced">S</span>').replace(/\./g,'<span class="ti pd">&#8203;</span>').replace(/%/g,'<span class="pc">%</span>');

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,prog=(t,a,d)=>cl((t-a)/d);
const eo=k=>1-Math.pow(1-cl(k),3),eb=k=>{k=cl(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const env=(t,a,b,fi=.25,fo=.2)=>t<a||t>b?0:Math.min(eb(prog(t,a,fi)),1-prog(t,b-fo,fo));
const pop=(t,a,d=.3)=>`opacity:${cl(prog(t,a,d)*3)};transform:scale(${lerp(.5,1,eb(prog(t,a,d)))})`;
const END=49.12;
// captions: 2-3 word chunks
const KEY=/^(q|w|solgun|kamer|35|36|30|1,5|kalkan|maksla|efsane|hız|çeviklik|üçlü|tonik|yetenek|9\.|gündüz|gece|diana|kötü)/i;
const CH=[];{let cur=[];WORDS.forEach((x,i)=>{cur.push(x);const nx=WORDS[i+1];const len=cur.map(y=>y[2]).join(' ').length;const nlen=nx?len+1+nx[2].length:0;if(/[,.?!]$/.test(x[2])||cur.length>=3||nlen>17||!nx||nx[0]-x[1]>.3){CH.push(cur);cur=[]}})}
function caption(t){for(let i=0;i<CH.length;i++){const a=CH[i][0][0],b=Math.min(CH[i+1]?CH[i+1][0][0]:99,CH[i][CH[i].length-1][1]+.35);if(t>=a&&t<b){const k=prog(t,a,.12);
 return `<div class="cap" style="transform:scale(${lerp(.8,1,eb(k))})">`+CH[i].map(x=>{const s=tr(x[2].replace(/[,.?!]$/,'').toLocaleUpperCase('tr'));return KEY.test(x[2].replace(/['’].*/,''))?`<span class="y">${s}</span>`:s}).join(' ')+'</div>'}}return ''}
const CARD=(t,a,b,inner,top=300,w=820,out='')=>{const k=env(t,a,b);if(!k)return '';return `<div class="ab" style="left:${(1080-40-w)/2}px;width:${w}px;top:${top}px;opacity:${cl(k*3)};transform:translateY(${(1-eo(prog(t,a,.35)))*-120}px) rotate(${lerp(-5,-1.5,eo(prog(t,a,.35)))}deg)"><div class="paper" style="padding:30px 34px 32px">${inner}</div>${out}</div>`};
const STAMP=(t,a,txt,col,x,y,rot=12)=>{const k=prog(t,a,.22);if(k<=0)return '';return `<div class="stamp" style="position:absolute;left:${x}px;top:${y}px;color:${col};opacity:${cl(k*4)};transform:rotate(${rot}deg) scale(${lerp(3,1,eo(k))})">${tr(txt)}</div>`};
window.render=function(t){let O=`<div class="tag"><span style="font-size:34px;letter-spacing:.06em;padding:4px 18px 2px;background:rgba(11,11,15,.75);border-radius:8px">FEEDLEME HOCAM</span></div>`;
 // 1) hook
 if(t<4.0){const k=env(t,.05,4.0,.3,.2);O+=`<div class="ab" style="left:110px;width:820px;top:330px;text-align:center;opacity:${cl(k*3)};transform:rotate(-3deg) scale(${lerp(1.6,1,eb(prog(t,.05,.3)))})"><div style="display:inline-block;background:#F4EFE6;color:#0B0B0F;padding:14px 34px 6px;font-size:84px;line-height:1.05;box-shadow:12px 14px 0 rgba(0,0,0,.55)">${tr('HÂLÂ Q MU')}<br>${tr('MAKSLIYORSUN?')}</div></div>`;
  if(t>=1.35)O+=`<div class="ab" style="left:0;right:40px;top:640px;text-align:center;opacity:${cl(k*3)}"><img class="ic" src="assets/spell_DianaQ.png" style="display:inline-block;width:170px;height:170px;transform:rotate(-6deg);${pop(t,1.35)}"></div>`;
  if(t>=2.3)O+=`<div class="ab" style="left:0;right:40px;top:600px;text-align:center;font-family:Mon;font-weight:900;font-size:250px;color:#FF3B5C;-webkit-text-stroke:8px #0B0B0F;paint-order:stroke fill;opacity:${cl(prog(t,2.3,.1)*3)*cl(k*3)};transform:scale(${lerp(2.5,1,eo(prog(t,2.3,.25)))}) rotate(-8deg)">✕</div>`}
 // 2) Pale Cascade buffed
 O+=CARD(t,4.0,9.6,`<div class="row"><img class="ic" src="assets/spell_DianaOrbs.png" style="width:150px;height:150px;border-color:#7FB800"><div><div style="font-size:42px;opacity:.7">W</div><div style="font-size:72px;line-height:1">${tr('SOLGUN KAMER')}</div><div style="font-size:40px;margin-top:8px;${pop(t,4.3)}">${tr('2 YAMADIR BUFF YİYOR')}</div></div></div>`,330,820,STAMP(t,4.88,'BUFF','#7FB800',640,-34));
 if(t>=7.6&&t<9.6)O+=`<div class="ab" style="left:0;right:40px;top:620px;text-align:center;font-size:96px;opacity:${env(t,7.6,9.6)}"><span style="display:inline-block;background:#D4FF3A;color:#0B0B0F;padding:6px 30px 0;transform:rotate(-3deg);box-shadow:10px 12px 0 rgba(0,0,0,.5)">W &gt; Q</span></div>`;
 // 3) Q vs W
 O+=CARD(t,9.7,25.3,`<div class="row"><img class="ic" src="assets/spell_DianaQ.png" style="width:110px;height:110px"><div><div style="font-size:50px;line-height:1">${tr('Q / HİLAL SALDIRISI')}</div><div style="font-size:30px;opacity:.7;margin-top:4px">${tr('PUAN BAŞINA')}</div>
   <div style="font-size:40px">${t>=12.0?`<span class="v" style="${pop(t,12.0)}">+35 HASAR</span>`:''}${t>=13.3?`<span class="v" style="${pop(t,13.3)}">${tr('-0.5 SN')}</span>`:''}</div></div></div>
  ${t>=15.2?`<div style="height:4px;background:#0B0B0F;margin:20px 0;opacity:.2"></div><div class="row" style="${pop(t,15.2,.35)}"><img class="ic" src="assets/spell_DianaOrbs.png" style="width:110px;height:110px;border-color:#7FB800"><div><div style="font-size:50px;line-height:1">${tr('W / SOLGUN KAMER')}</div><div style="font-size:30px;opacity:.7;margin-top:4px">${tr('PUAN BAŞINA')}</div>
   <div style="font-size:40px">${t>=16.7?`<span class="v" style="background:#D4FF3A;${pop(t,16.7)}">+36 HASAR</span>`:''}${t>=18.05?`<span class="v" style="background:#D4FF3A;${pop(t,18.05)}">+30 KALKAN</span>`:''}${t>=19.15?`<span class="v" style="background:#D4FF3A;${pop(t,19.15)}">${tr('-1.5 SN')}</span>`:''}</div>
   ${t>=21.7?`<div style="font-size:34px;margin-top:6px;${pop(t,21.7)}">${tr('+ KALKAN BONUS CANLA BÜYÜR')}</div>`:''}</div></div>`:''}`,290,820,STAMP(t,24.75,'W MAKS','#7FB800',560,-34,10));
 // 4) runes
 O+=CARD(t,25.3,36.1,`<div style="font-size:40px;opacity:.7;margin-bottom:8px">${tr('RÜNLER')}</div><div class="row"><img src="assets/rune_conq.png" style="width:110px;height:110px"><span style="font-size:58px">${tr('YENİLMEZ')}</span></div>
  ${t>=27.6?`<div class="row" style="margin-top:12px;${pop(t,27.6)}"><img src="assets/rune_alacrity.png" style="width:90px;height:90px;${t>=28.6?'filter:grayscale(1);opacity:.5':''}"><span style="position:relative;font-size:48px;${t>=28.6?'opacity:.5':''}">${tr('EFSANE: ÇEVİKLİK')}<i style="position:absolute;left:-4%;top:46%;height:8px;width:${108*eo(prog(t,28.6,.3))}%;background:#FF3B5C;transform:rotate(-3deg)"></i></span></div>`:''}
  ${t>=29.0?`<div class="row" style="margin-top:10px;${pop(t,29.0)}"><img src="assets/rune_haste.png" style="width:90px;height:90px"><span style="font-size:52px;background:#D4FF3A;padding:0 10px">${tr('EFSANE: HIZ')}</span></div>`:''}
  ${t>=30.7?`<div class="row" style="margin-top:12px;${pop(t,30.7)}"><img src="assets/rune_tonic.png" style="width:90px;height:90px"><span style="font-size:52px;background:#D4FF3A;padding:0 10px">${tr('ÜÇLÜ TONİK')}</span></div>`:''}
  ${t>=31.85?`<div class="row" style="margin-top:16px;${pop(t,31.85)}"><img class="ic" src="assets/passive.png" style="width:72px;height:72px"><span style="font-size:36px">${tr('PASİF ZATEN SALDIRI HIZI VERİYOR')}</span></div>`:''}`,260);
 // 5) skill order
 if(t>=36.2&&t<41.0){const q=[37.2,37.5,37.8],wv=[38.7,39.05,39.4,39.75,40.1];
  O+=CARD(t,36.2,41.0,`<div style="font-size:56px;text-align:center;margin-bottom:10px">${tr('SKİLL SIRASI')}</div>
   ${[['spell_DianaOrbs','W',wv,1],['spell_DianaQ','Q',q,0],['spell_DianaTeleport','E',[36.6],0]].map(([i,k,ts,on])=>`<div class="row" style="margin:12px 0 0 30px;gap:16px"><img class="ic" src="assets/${i}.png" style="width:84px;height:84px;${on?'border-color:#7FB800':''}"><span style="font-size:52px;width:50px">${k}</span>${[0,1,2,3,4].map(j=>{const f=ts[j]!=null&&t>=ts[j];return `<span class="pt ${f?'on':''}" style="${f?`transform:scale(${lerp(1.8,1,eb(prog(t,ts[j],.25)))})`:''}"></span>`}).join('')}</div>`).join('')}
   ${t>=38.76?`<div style="font-size:42px;text-align:center;margin-top:18px;${pop(t,38.76)}"><span style="background:#D4FF3A;padding:0 10px">${tr('W 9. SEVİYEDE MAKS')}</span></div>`:''}`,320)}
 // 6) item
 if(t>=41.1&&t<46.1){const k=env(t,41.1,46.1);O+=`<div class="ab" style="left:0;right:40px;top:400px;text-align:center;opacity:${cl(k*3)}"><div class="paper" style="display:inline-block;padding:30px 50px 30px;transform:rotate(-3deg) scale(${lerp(.6,1,eb(prog(t,41.1,.35)))})"><img class="ic" src="assets/item_2510.png" style="width:200px;height:200px;margin:0 auto"><div style="font-size:66px;margin-top:16px">${tr('GÜNDÜZ VE GECE')}</div></div></div>`;
  if(t>=43.4)O+=`<div class="ab" style="left:0;right:40px;top:860px;text-align:center"><span style="display:inline-block;font-size:70px;background:#D4FF3A;color:#0B0B0F;padding:6px 26px 0;transform:rotate(2deg);box-shadow:10px 12px 0 rgba(0,0,0,.5);${pop(t,43.4)}">${tr('W SPAM')}</span></div>`}
 // captions
 if(t>=2.3&&t<END)O+=caption(t);
 // end card
 if(t>=END){const k=prog(t,END,.35);O+=`<div class="ab" style="inset:0;background:rgba(11,11,15,${.6*cl(k*2)})"></div><div class="ab" style="left:0;right:40px;top:640px;text-align:center;opacity:${cl(k*2)};transform:rotate(-3deg) scale(${lerp(1.3,1,eo(k))})"><div style="font-size:64px;letter-spacing:.1em">${tr('TAKİP ET')}</div><div style="display:inline-block;margin-top:18px;font-size:120px;line-height:1.1;padding:10px 40px 0;background:#D4FF3A;color:#0B0B0F;box-shadow:14px 16px 0 rgba(0,0,0,.6)">FEEDLEME<br>HOCAM</div></div>`}
 document.getElementById('dyn').innerHTML=O};

 ['card',25.3,0],['pop',27.6,0],['stamp_dan',28.6,-4],['levelup',29.0,0],['levelup',30.7,0],['pop',31.85,0],['card',36.2,0],['levelup',37.2,-2],['levelup',37.5,-2],['levelup',37.8,-2],['levelup',38.7,-2],['levelup',39.05,-2],['levelup',39.4,-2],['levelup',39.75,-2],['levelup',40.1,-2],['card',41.1,0],['yazi_vurus',43.4,-2]];
