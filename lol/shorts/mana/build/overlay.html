<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Mon;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+0130-0131,U+015E-015F,U+011E-011F}
@font-face{font-family:Mon;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Mon;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-ext-900-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+0130-0131,U+015E-015F,U+011E-011F}
@font-face{font-family:Mon;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:Bf;font-weight:900;src:url(assets/fonts/beaufortforlol-heavy.otf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:absolute;inset:0;overflow:hidden;font-family:Mon;font-weight:800;color:#fff}
.L{position:absolute;inset:0}.ab{position:absolute}
.lol{font-family:Bf;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.gold{background:linear-gradient(180deg,#FFF6D6 0,#F0D58C 38%,#C8AA6E 62%,#8A6A32 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.85)) drop-shadow(0 0 18px rgba(0,0,0,.7))}
#cap{position:absolute;left:100px;right:100px;top:1300px;height:170px;display:flex;align-items:center;justify-content:center;text-align:center}
#cap span{font-size:60px;line-height:1.15;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 4px 0 rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.85),0 0 4px #000}
.y{color:#FFC23D}
#tag{position:absolute;left:0;right:0;top:112px;text-align:center}
#tag span{font-family:Bf;font-weight:900;font-size:34px;letter-spacing:.12em;color:#010A13;background:linear-gradient(180deg,#F0D58C,#C8AA6E);padding:4px 20px 6px;border-radius:6px;border:2px solid #FFF1D6}
.card{display:inline-flex;align-items:center;gap:22px;padding:14px 30px 14px 14px;background:linear-gradient(180deg,rgba(14,30,48,.95),rgba(3,8,16,.95));border:4px solid #C8AA6E;border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.card img{width:120px;height:120px;border:3px solid #C8AA6E;border-radius:6px}
</style></head><body>
<div id="root"><div id="dyn" class="L"></div><div id="cap"></div><div id="tag"><span>FEEDLEME HOCAM</span></div></div>
<script src="words.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-cl(k),3);
const eb=k=>{k=cl(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const prog=(t,a,d)=>cl((t-a)/d);
const TR=s=>s.toLocaleUpperCase('tr');
const norm=s=>s.toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9%]/g,'');
const MISSING=[];
function C(w,n=1){let k=0;for(const x of WORDS){if(norm(x[2])===norm(w)&&++k===n)return x[0]}MISSING.push(w+n);return 0}
const SEG=[[0, 2.8, 0.0, 3.0, "play"], [2.8, 6.6, 3.0, 8.2, "play"], [6.6, 10.78, 9.9, 14.3, "play"], [10.78, 14.66, 14.4, 18.4, "play"], [14.66, 18.08, 18.5, 21.9, "play"], [18.08, 20.66, 21.9, 24.0, "play"], [20.66, 22.64, 24.0, 26.5, "play"], [22.64, 24.14, 26.5, 28.3, "play"], [24.14, 27.7, 28.3, 32.8, "play"], [27.7, 28.7, 32.9, 34.0, "play"], [28.7, 36.04, 34.0, 40.0, "play"], [36.04, 38.02, 40.0, 42.4, "play"], [38.02, 42.7, 42.4, 48.0, "play"], [42.7, 47.1, 48.0, 52.8, "play"], [47.1, 49.58, 52.8, 55.9, "play"], [49.58, 53.0, 56.0, 59.0, "play"], [53.0, 54.1, 59.0, 60.6, "play"], [54.1, 57.48, 60.6, 64.6, "play"], [57.48, 60.92, 64.6, 67.6, "play"], [60.92, 62.78, 67.6, 70.0, "play"], [62.78, 65.02, 70.3, 73.0, "play"], [65.02, 68.8, 73.0, 77.9, "play"], [68.8, 70.3, 74.0, 75.5, "blur"]];
function S(src){for(const [a,b,s,e,m] of SEG){if(m==='play'&&src>=s&&src<=e)return a+(src-s)/(e-s)*(b-a)}return null}
function srcAt(t){for(const [a,b,s,e,m] of SEG){if(t>=a&&t<b)return s+(t-a)/(b-a)*(e-s)}return 0}
function env(t,a,b,fi=.22,fo=.18){if(t<a||t>b)return 0;return Math.min(eb(prog(t,a,fi)),1-prog(t,b-fo,fo))}
const glow=(c,s=1)=>`filter:drop-shadow(0 0 ${10*s}px ${c}) drop-shadow(0 0 ${26*s}px ${c}) drop-shadow(0 6px 0 rgba(0,0,0,.6))`;
function ring(x,y,r,col,n,k){return `<div class="ab" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:radial-gradient(circle,#0a1626 55%,#050b14);border:8px solid ${col};box-shadow:0 0 0 4px #010A13,inset 0 0 22px ${col};display:flex;align-items:center;justify-content:center;transform:scale(${lerp(.3,1,k)});opacity:${cl(k*2)};${glow(col,.6)}"><span class="lol gold" style="font-size:${r*1.35}px;line-height:1;margin-top:${r*.08}px">${n}</span></div>`}
function item(id,name,k,y=250,extra=''){return `<div class="ab" style="left:0;right:0;top:${y}px;text-align:center;opacity:${cl(k*2)};transform:translateY(${(1-eo(k))*-30}px) scale(${lerp(.7,1,eb(k))})"><div class="card"><img src="assets/item_${id}.png"><span class="lol gold" style="font-size:58px;line-height:1.05;text-align:left">${name}</span>${extra}</div></div>`}
function stamp(txt,col,y,k,fs=110,rot=-6){return `<div class="ab" style="left:0;right:0;top:${y}px;text-align:center;opacity:${cl(k*3)};transform:scale(${lerp(1.8,1,eb(k))}) rotate(${rot}deg)"><span class="lol" style="display:inline-block;font-size:${fs}px;line-height:1;color:${col};border:7px solid ${col};border-radius:10px;padding:8px 30px 4px;background:rgba(3,8,16,.75);text-shadow:0 4px 0 #000">${txt}</span></div>`}
function bubble(cx,cy,w,h,txt,k,fs){return `<div class="ab" style="left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;height:${h}px;transform:scale(${lerp(.3,1,k)});opacity:${cl(k*2)}"><div style="position:absolute;inset:0;background:#fff;border:6px solid #010A13;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:${fs}px;line-height:1.1;color:#010A13;padding:0 40px">${txt}</div><div style="position:absolute;left:${w*.2}px;top:${h-20}px;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:54px solid #010A13;transform:rotate(22deg)"></div><div style="position:absolute;left:${w*.2+8}px;top:${h-28}px;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:42px solid #fff;transform:rotate(22deg)"></div></div>`}
const T={spam:C('spamlıyor'),dekor:C('dekor',1),sinsi:C('sinsi'),bir:C('birincisi'),tanrica:C('tanrıça'),canbicen:C('canbiçen'),satiyor:C('satıyorlar'),kotusu:C('kötüsü'),ilk:C('ilk',1),
 daha:C('daha',1),luden:C('luden'),rylai:C("rylai'nin"),bunlar:C('bunlar'),safir:C('safir',1),dusun:C('düşünsene'),boylece:C('böylece'),kayip:C('kayıp',1),ya:C('ya',2),n90:C('90'),ama4:C('ama',3),peri:C('peri tılsımı'),jinx:C('jinx'),
 n200:C('200'),p50:C('%50'),birdaha:C('bir',4),ustelik:C('üstelik'),n60:C('60'),of:C('of'),tek:C('tek'),end:68.80};
const KEY=/^(mana|skill|challenger|sinsi|taktik|lucian|tanrıça|gözyaşı|canbiçen|400|120|gold|safir|kristal|kayıp|cilt|90|peri|tılsımı|200|%50|60|yone|tek|dekor|bomboş|manasız)/;
const FIX={fightin:'fightın',hitemin:'itemin',hitem:'item',hitemini:'itemini',lisandra:'Lissandra',feryadığı:'Feryadı'};
const CH=[];{let cur=[];WORDS.forEach((w,i)=>{cur.push(w);const nx=WORDS[i+1];const len=cur.map(x=>x[2]).join(' ').length;if(/[,.?!:]$/.test(w[2])||cur.length>=2||len>11||!nx||nx[0]-w[1]>0.35){CH.push(cur);cur=[]}})}
function caption(t){let h='';for(let i=0;i<CH.length;i++){const a=CH[i][0][0],b=Math.min(CH[i+1]?CH[i+1][0][0]:99,CH[i][CH[i].length-1][1]+0.3);if(t>=a&&t<b){const k=prog(t,a,.1);
 h=`<span style="display:inline-block;transform:scale(${lerp(.75,1,eb(k))})">`+CH[i].map(w=>{let s=w[2].replace(/[,.:?!]$/,'');let n=norm(s);if(FIX[n])s=FIX[n];if(s.toLowerCase()==='yön'&&norm(CH[i].map(x=>x[2]).join(''))){} s=TR(s);return KEY.test(norm(s))?`<span class="y">${s}</span>`:s}).join(' ').replace(/ '/g,"'")+'</span>';break}}$('cap').innerHTML=h}
window.render=function(t){
 let H='';
 // speech bubble (replaces the English one, follows the champion)
 {const a=S(6.0),b=S(8.2);if(t>=a&&t<=b){const s=srcAt(t),k=env(t,a,b,.15,.12);const P=[[6.0,860,660],[6.8,832,700],[7.6,720,920],[8.2,600,1140]];let cx=P[3][1],cy=P[3][2];for(let i=0;i<3;i++){if(s<=P[i+1][0]){const q=cl((s-P[i][0])/(P[i+1][0]-P[i][0]));cx=lerp(P[i][1],P[i+1][1],q);cy=lerp(P[i][2],P[i+1][2],q);break}}H+=bubble(cx,cy,500,310,'5 dakikadır skill kaçırıyorum...',k,46)}}
 // 3 SİNSİ TAKTİK
 if(t>=T.sinsi-.05&&t<T.bir){const k=prog(t,T.sinsi-.05,.3);H+=`<div class="ab" style="left:0;right:0;top:230px;text-align:center;opacity:${cl(k*3)*(1-prog(t,T.bir-.2,.2))};transform:scale(${lerp(1.5,1,eb(k))})"><span class="lol gold" style="font-size:96px">3 SİNSİ TAKTİK</span></div>`}
 // 1: Tanrıça'nın Gözyaşı on Lucian
 if(t>=T.bir-.05&&t<T.tanrica){H+=ring(540,330,95,'#C8AA6E','1',env(t,T.bir-.05,T.tanrica))}
 if(t>=T.tanrica-.05&&t<T.canbicen){H+=item('3070',"TANRIÇA'NIN<br>GÖZYAŞI",env(t,T.tanrica-.05,T.canbicen))}
 if(t>=T.canbicen-.05&&t<T.kotusu-.05){const k=env(t,T.canbicen-.05,T.kotusu-.05);H+=item('3508','CANBİÇEN',k);
  if(t>=T.satiyor-.05){const kk=prog(t,T.satiyor-.05,.25);H+=`<div class="ab" style="left:0;right:0;top:450px;text-align:center;opacity:${cl(kk*3)*k}"><div class="card" style="border-color:#FF4A3A"><img src="assets/item_3070.png" style="border-color:#FF4A3A;filter:grayscale(.4)"><span class="lol" style="font-size:64px;color:#FF5A36">SAT!</span></div></div>`}}
 if(t>=T.kotusu-.05&&t<T.ilk){H+=stamp('EN KÖTÜSÜ','#FF5A36',300,prog(t,T.kotusu-.05,.25))}
 // DAHA İYİSİ VAR! (replaces "WE CAN DO BETTER!")
 if(t>=T.daha-.05&&t<S(34.0)){const k=prog(t,T.daha-.05,.25);H+=`<div class="ab" style="left:0;right:0;top:1170px;text-align:center;opacity:${cl(k*3)};transform:scale(${lerp(1.4,1,eb(k))})"><span class="lol gold" style="font-size:96px">DAHA İYİSİ VAR!</span></div>`}
 // Luden / Rylai (first items mages finish)
 if(t>=T.luden-.05&&t<T.bunlar){const k1=env(t,T.luden-.05,T.bunlar),k2=env(t,T.rylai-.05,T.bunlar);H+=item('6655',"LUDEN'İN FERYADI",k1,240)+(t>=T.rylai-.05?item('3116',"RYLAI'NİN<br>KRİSTAL ASASI",k2,420):'')}
 // 2: Safir Kristal
 if(t>=T.bunlar-.05&&t<T.safir){H+=ring(540,330,95,'#0AC8B9','2',env(t,T.bunlar-.05,T.safir))}
 if(t>=T.safir-.05&&t<T.dusun+.6){H+=item('1027','SAFİR KRİSTAL',env(t,T.safir-.05,T.dusun+.6))}
 if(t>=T.kayip-.05&&t<T.ya){const k=env(t,T.kayip-.05,T.ya);H+=`<div class="ab" style="left:0;right:0;top:250px;text-align:center;opacity:${cl(k*2)};transform:scale(${lerp(.7,1,eb(k))})"><div class="card"><img src="assets/item_1027.png"><span class="lol gold" style="font-size:80px">➜</span><img src="assets/item_3802.png"><span class="lol gold" style="font-size:58px">KAYIP CİLT</span></div></div>`}
 if(t>=T.n90-.05&&t<T.ama4){H+=stamp('SADECE -90 GOLD','#FFC23D',300,prog(t,T.n90-.05,.25),84,0)}
 // 3: Peri Tılsımı
 if(t>=T.ama4-.05&&t<T.peri){H+=ring(540,330,95,'#FF5AC8','3',env(t,T.ama4-.05,T.peri))}
 if(t>=T.peri-.05&&t<T.jinx+.6){const k=prog(t,T.peri-.05,.3);H+=`<div class="ab" style="left:0;right:0;top:400px;text-align:center;opacity:${cl(k*3)*(1-prog(t,T.jinx+.4,.2))};transform:scale(${lerp(1.5,1,eb(k))})"><span class="lol gold" style="font-size:110px">PERİ TILSIMI</span></div>`}
 if(t>=T.p50-.05&&t<T.birdaha){const k=env(t,T.p50-.05,T.birdaha);H+=item('1004','+%50 MANA<br>YENİLENMESİ',k)}
 // Fiyat - Satış = Kayıp (covers the English Cost/Sell line)
 {const a=S(70.3),b=T.of;if(t>=a&&t<b){const o=1-prog(t,b-.15,.15);H+=`<div class="ab" style="left:0;right:0;top:1310px;height:250px;background:#050d18;border-top:4px solid #C8AA6E;border-bottom:4px solid #C8AA6E;opacity:${o};display:flex;align-items:center;justify-content:center;gap:26px">
   <div style="text-align:center"><div class="lol" style="font-size:32px;color:#C8AA6E">FİYAT</div><div class="lol gold" style="font-size:96px;line-height:1">200</div></div><div class="lol" style="font-size:90px;color:#fff">-</div>
   <div style="text-align:center"><div class="lol" style="font-size:32px;color:#C8AA6E">SATIŞ</div><div class="lol gold" style="font-size:96px;line-height:1">140</div></div><div class="lol" style="font-size:90px;color:#fff">=</div>
   <div style="text-align:center"><div class="lol" style="font-size:32px;color:#FF5A36">KAYIP</div><div class="lol" style="font-size:96px;line-height:1;color:#FF5A36">60</div></div></div>`}}
 if(t>=T.tek-.05&&t<T.end){H+=stamp('TEK!','#FF3B4E',360,prog(t,T.tek-.05,.2),150,-8)}
 // END CARD over blurred gameplay (silent)
 if(t>=T.end-.05){const k=prog(t,T.end-.05,.35);H+=`<div class="L" style="background:rgba(2,8,18,.5);opacity:${cl(k*2)}"></div><div class="ab" style="left:0;right:0;top:660px;text-align:center;opacity:${cl(k*2)};transform:scale(${lerp(1.3,1,eo(k))})"><div class="lol" style="font-size:56px;letter-spacing:.2em;color:#F0D58C;text-shadow:0 4px 0 #000">TAKİP ET</div><div class="lol gold" style="font-size:150px;line-height:1.02;margin-top:10px">FEEDLEME<br>HOCAM</div></div>`}
 $('dyn').innerHTML=H;
 const hideCap=(t>=T.daha-.05&&t<S(34.0))||(t>=S(70.3)&&t<T.of)||t>=T.end-.05;
 if(!hideCap)caption(t);else $('cap').innerHTML='';
 $('tag').style.opacity=t<T.end?1:0;
};
const SFX=[];const sfx=(n,t,g=0)=>{if(t!=null&&isFinite(t))SFX.push([n,+(+t).toFixed(3),g])};
sfx('bubble',S(6.0));sfx('swish',T.sinsi-.05);sfx('ring',T.bir-.05);sfx('item',T.tanrica-.05);sfx('item',T.canbicen-.05);sfx('stamp',T.satiyor-.05);sfx('stamp',T.kotusu-.05);
sfx('card',T.daha-.08,-2);sfx('item',T.luden-.05);sfx('item',T.rylai-.05,-2);sfx('ring',T.bunlar-.05);sfx('item',T.safir-.05);sfx('item',T.kayip-.05);sfx('stamp',T.n90-.05);
sfx('ring',T.ama4-.05);sfx('swish',T.peri-.05);sfx('item',T.p50-.05);sfx('card',S(70.3)-.05,-3);sfx('tek',T.tek-.05);
window.SFX=SFX;window.CUES=T;window.ready=Promise.resolve();
</script></body></html>
