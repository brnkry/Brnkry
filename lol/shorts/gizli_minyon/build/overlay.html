<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-cl(k),3);
const eb=k=>{k=cl(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const prog=(t,a,d)=>cl((t-a)/d);
const TR=s=>s.toLocaleUpperCase('tr');
const norm=s=>s.toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9%]/g,'');
const MISSING=[];
function C(w,n=1){let k=0;for(const x of WORDS){if(norm(x[2])===norm(w)&&++k===n)return x[0]}MISSING.push(w+n);return 0}
// segment table [outA,outB,srcA,srcB,mode] (same as seg.json)
const SEG=[[0.0, 3.66, 3.2, 0, "freeze"], [3.66, 6.36, 5.0, 10.4, "play"], [6.36, 9.3, 10.0, 11.4, "play"], [9.3, 14.56, 15.5, 20.2, "play"], [14.56, 19.54, 20.2, 24.9, "play"], [19.54, 22.88, 24.9, 28.6, "play"], [22.88, 25.94, 28.6, 32.4, "play"], [25.94, 31.62, 32.4, 39.2, "play"], [31.62, 35.44, 39.2, 43.6, "play"], [35.44, 39.8, 43.6, 49.4, "play"], [39.8, 44.92, 49.6, 55.0, "play"], [44.92, 46.52, 55.0, 57.2, "play"], [46.52, 50.9, 57.2, 63.0, "play"], [50.9, 53.5, 63.0, 66.4, "play"], [53.5, 57.12, 66.4, 69.4, "play"], [57.12, 59.78, 69.4, 0, "freeze"], [59.78, 62.83, 24.9, 28.6, "play"], [62.83, 64.3, 69.4, 0, "freeze"]];
function S(src){for(const [a,b,s,e,m] of SEG){if(m==='play'&&src>=s&&src<=e)return a+(src-s)/(e-s)*(b-a)}return null}
const END=64.3;
// pop-in envelope: in at a, out at b
function env(t,a,b,fi=.22,fo=.18){if(t<a||t>b)return 0;return Math.min(eb(prog(t,a,fi)),1-prog(t,b-fo,fo))}
function vis(t,a,b,fo=.15){return t>=a&&t<=b?Math.min(cl((t-a)/.12),1-prog(t,b-fo,fo)):0}
// ---------- icon factories (our own designs)
const glow=(c,s=1)=>`filter:drop-shadow(0 0 ${10*s}px ${c}) drop-shadow(0 0 ${26*s}px ${c}) drop-shadow(0 6px 0 rgba(0,0,0,.6))`;
function chevron(x,y,w,col,k,t){ // solid double chevron, bobbing
 const h=w*1.05, bob=Math.sin(t*9)*10;
 return `<svg class="ab" style="left:${x-w/2}px;top:${y-h/2+bob}px;overflow:visible;transform:scale(${lerp(.4,1,k)});transform-origin:50% 0;opacity:${cl(k*2)};${glow(col)}" width="${w}" height="${h}" viewBox="0 0 100 105"><path d="M8 6 L50 40 L92 6 L92 30 L50 64 L8 30Z" fill="${col}" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M8 44 L50 78 L92 44 L92 68 L50 102 L8 68Z" fill="${col}" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity=".85"/></svg>`}
function qmark(x,y,s,col,k,rot=0){return `<div class="ab" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${lerp(.3,1,k)});opacity:${cl(k*2)};font-weight:900;font-size:${s}px;line-height:1;color:${col};-webkit-text-stroke:6px #fff;paint-order:stroke fill;${glow(col,.8)}">?</div>`}
function disc(x,y,r,col,txt,k){return `<div class="ab" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),${col};border:8px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${r*1.05}px;color:#010A13;transform:scale(${lerp(.3,1,k)});opacity:${cl(k*2)};${glow(col,.8)}">${txt}</div>`}
function bubble(x,y,w,h,txt,k,fs=70){return `<div class="ab" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:scale(${lerp(.3,1,k)}) rotate(-4deg);transform-origin:20% 100%;opacity:${cl(k*2)}"><div style="position:absolute;inset:0;background:#fff;border:7px solid #010A13;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:${fs}px;line-height:1.05;color:#010A13">${txt}</div><div style="position:absolute;left:${w*.18}px;top:${h-24}px;width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:70px solid #010A13;transform:rotate(18deg)"></div><div style="position:absolute;left:${w*.18+10}px;top:${h-34}px;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:56px solid #fff;transform:rotate(18deg)"></div></div>`}
function coin(x,y,r,k){return `<div class="ab" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;transform:scale(${lerp(.3,1,k)}) rotate(${(1-k)*-40}deg);opacity:${cl(k*2)};${glow('#FFC23D',.7)}">${[0,1,2].map(i=>`<div style="position:absolute;left:${i*r*.18}px;top:${r*.5-i*r*.32}px;width:${r*1.6}px;height:${r*1.1}px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#FFF1B0,#FFC23D 45%,#B8801C);border:5px solid #6b4a0e;box-shadow:inset 0 -10px 0 #9a6a14"></div>`).join('')}</div>`}
function bigText(html,y,k,fs=150,extra=''){return `<div class="ab txt" style="left:0;right:0;top:${y}px;text-align:center;font-size:${fs}px;line-height:1.05;transform:scale(${lerp(1.5,1,eo(k))});opacity:${cl(k*3)};${extra}">${html}</div>`}
function dim(o){return `<div class="L" style="background:#020812;opacity:${o}"></div>`}
// ---------- cues
const T={l17:C('17'),p99:C('%99'),iki:C('iki'),gizli:C('gizli',1),habersiz:C('habersiz'),mac:C('maç'),bir:C('birincisi'),tunel:C('tünel'),pasif:C('pasifi'),
 hep:C('hepimiz'),rakip:C('rakip',1)||C('rekip',1),donup:C('dönüp'),ama:C('ama',2),kuleye:C('kuleye',1),sen:C('sen',1),olsan:C('olsan'),yani:C('yani',1),atlar:C('atlar'),izler:C('izler'),
 biliyorsan:C('biliyorsan'),bedava:C('bedava'),bilmiyorsan:C('bilmiyorsan',1),binlerce:C('binlerce'),cunku:C('çünkü'),cannon:C('cannon',1),p30:C('%30'),ve2:C('ve',3),sadece2:C('sadece',2),
 yani2:C('yani',2),kaplama:C('kaplamalarını'),toplarsin:C('toplarsın'),ama3:C('ama',4),roam:C('roam'),yoksa:C('yoksa'),tamami:C('tamamı'),peki:C('peki'),yorum:C('yorumlara'),bilmi2:C('bilmiyorsan',2),umurs:C('umursamıyordu'),end:62.83};
// ---------- captions (1-2 words, in the reference style but our fonts/colours)
const KEY=/^(17|%|minyon|tünel|görüşü|gizli|kule|kill|bedava|altın|cannon|orta|mid|roam|kaplama|asla|sadece|ölüyor|izler|habersiz|umursa)/;
const FIX={rekip:'rakip',kililer:'killer',farkettirmeden:'fark ettirmeden',durüst:'dürüst',fidleme:'feedleme'};
const CH=[];{let cur=[];WORDS.forEach((w,i)=>{cur.push(w);const nx=WORDS[i+1];const len=cur.map(x=>x[2]).join(' ').length;if(/[,.?!:]$/.test(w[2])||cur.length>=2||len>11||!nx||nx[0]-w[1]>0.35){CH.push(cur);cur=[]}})}
function caption(t){let h='';for(let i=0;i<CH.length;i++){const a=CH[i][0][0],b=Math.min(CH[i+1]?CH[i+1][0][0]:99,CH[i][CH[i].length-1][1]+0.3);if(t>=a&&t<b){const k=prog(t,a,.1);
 h=`<span style="display:inline-block;transform:scale(${lerp(.75,1,eb(k))})">`+CH[i].map(w=>{let s=w[2].replace(/[,.:?!]$/,'');const n=norm(s);if(FIX[n])s=FIX[n];s=TR(s);return KEY.test(norm(s))?`<span class="y">${s}</span>`:s}).join(' ').replace(/ '/g,"'")+'</span>';break}}$('cap').innerHTML=h}
// ---------- render
window.render=function(t){
 let H='';
 // 1) HOOK: LoL emblem + 17 YIL
 if(t<T.p99+.15){const out=prog(t,T.p99-.15,.25);
  const ke=eb(prog(t,0,.35)), k=prog(t,T.l17-.2,.35);
  const es=lerp(.3,1,ke)*lerp(1,.62,eo(k)), ey=lerp(0,140,eo(k));
  // rings
  [0,1].forEach(i=>{const rk=prog(t,T.l17-.25+i*.08,.5);if(rk>0)H+=`<div class="ab" style="left:${540-260-i*40}px;top:${960-260-i*40+ey}px;width:${520+i*80}px;height:${520+i*80}px;border-radius:50%;border:${10-i*3}px solid ${i?'#0AC8B9':'#FFC23D'};transform:scale(${lerp(.6,1,eo(rk))});opacity:${cl(rk*3)*(1-out)}"></div>`});
  H+=`<img class="ab" src="assets/lol_emblem.png" style="left:${540-215}px;top:${960-240+ey}px;width:430px;transform:scale(${es});opacity:${cl(ke*3)*(1-out)};filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))">`;
  const orbs=[[190,600,62,'#FFC23D'],[880,560,56,'#0AC8B9'],[230,1180,52,'#2D6BFF'],[860,1150,70,'#FFF1D6'],[150,880,40,'#0AC8B9'],[940,860,46,'#FFC23D'],[560,1260,46,'#2D6BFF']];
  H+=orbs.map(([x,y,r,c],i)=>{const b=Math.sin(t*2.2+i)*16;const kk=eb(prog(t,T.l17-.15+i*.05,.4))*(1-out);return `<div class="ab" style="left:${x-r}px;top:${y-r+b}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,${c} 38%,#00000088 100%);transform:scale(${kk});box-shadow:0 18px 30px rgba(0,0,0,.45)"></div>`}).join('');
  if(t>=T.l17-.2){const s=lerp(.2,1,eb(k)), o=cl(k*3)*(1-out);
   H+=`<div class="ab" style="left:0;right:0;top:470px;text-align:center;transform:scale(${s}) rotate(${-4+Math.sin(t*2)*2}deg);opacity:${o}">
   <div style="font-weight:900;font-size:380px;line-height:.9;letter-spacing:-.04em;background:linear-gradient(180deg,#FFF6D0 0,#FFD25A 35%,#C8862A 70%,#7A4A12 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(8px 12px 0 #4a2a06) drop-shadow(0 20px 30px rgba(0,0,0,.6))">17</div>
   <div style="display:inline-block;margin-top:-10px;font-size:64px;color:#010A13;background:linear-gradient(180deg,#0AC8B9,#078a80);padding:4px 36px 10px;border-radius:12px;border:5px solid #FFF1D6;transform:rotate(3deg)">YIL</div></div>`;}
 }
 // 2) %99 + arrow
 if(t>=T.p99-.05&&t<T.iki+.1){const k=prog(t,T.p99-.05,.25),out=prog(t,T.iki-.1,.2);
  H+=`<div class="ab" style="left:120px;top:430px;transform:scale(${lerp(.3,1,eb(k))}) rotate(-8deg) skewX(-8deg);opacity:${cl(k*3)*(1-out)};font-weight:900;font-size:230px;line-height:1;background:linear-gradient(180deg,#FFE08A,#FF8A3D 60%,#FF3B4E);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,120,60,.8)) drop-shadow(8px 10px 0 #3a0a05)">%99</div>`;
  const ak=prog(t,T.p99+.2,.3);H+=`<svg class="ab" style="left:250px;top:760px;opacity:${cl(ak*3)*(1-out)};${glow('#0AC8B9',.7)}" width="360" height="380" viewBox="0 0 360 380"><path d="M40 20 C -10 160, 60 290, ${lerp(60,250,ak)} ${lerp(200,320,ak)}" fill="none" stroke="#0AC8B9" stroke-width="22" stroke-linecap="round"/><path d="M${lerp(60,250,ak)-40} ${lerp(200,320,ak)-55} L${lerp(60,250,ak)+15} ${lerp(200,320,ak)+5} L${lerp(60,250,ak)-55} ${lerp(200,320,ak)+30}" fill="#0AC8B9" stroke="#fff" stroke-width="5"/></svg>`;
 }
 // 3) ?? (covers src 5-6.9) and 1 2 discs (covers src 8.4-10.1)
 {const a=T.iki-.05,b=S(6.95);const k=env(t,a,b);if(k){H+=qmark(600,700,230,'#C48BFF',k,-12)+qmark(780,690,190,'#C48BFF',k,14)+qmark(450,730,150,'#C48BFF',k,-20)}}
 {const a=T.iki,b=S(10.2);if(t>=a&&t<=b){const k1=env(t,a,b),k2=env(t,a+.18,b);H+=disc(200,800,118,'#FFC23D','1',k1)+disc(470,795,118,'#0AC8B9','2',k2)}}
 // 4) YENİLGİ banner
 if(t>=T.mac-.1&&t<T.bir){const k=prog(t,T.mac-.1,.3),out=prog(t,T.bir-.2,.2);
  H+=`<div class="L" style="background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(120,0,0,.55));opacity:${cl(k*2)*(1-out)}"></div>`;
  H+=`<div class="ab" style="left:0;right:0;top:640px;text-align:center;opacity:${cl(k*3)*(1-out)};transform:scale(${lerp(1.6,1,eo(k))})"><div style="display:inline-block;padding:10px 70px 24px;background:linear-gradient(180deg,#3a0610,#12020a);border:7px solid #C8AA6E;border-radius:10px;box-shadow:0 0 60px rgba(255,40,60,.6)"><div style="font-weight:900;font-size:110px;line-height:1.1;letter-spacing:.06em;background:linear-gradient(180deg,#FFD6D6,#FF3B4E 55%,#7a0a14);-webkit-background-clip:text;color:transparent">YENİLGİ</div></div></div>`;
 }
 // 5) TÜNEL GÖRÜŞÜ card (covers their card src 15.5-20.2)
 if(t>=T.bir-.05&&t<T.hep){const k=prog(t,T.bir-.05,.25),out=prog(t,T.hep-.2,.2),o=cl(k*3)*(1-out);
  H+=`<div class="L" style="background:radial-gradient(ellipse at 50% 55%,rgba(6,18,30,.86),rgba(1,5,10,.97) 70%);opacity:${o}"></div>`;
  if(t<T.tunel-.05){const kk=prog(t,T.bir,.25);H+=`<div class="ab" style="left:0;right:0;top:820px;text-align:center;opacity:${o}"><div style="display:inline-block;width:240px;height:240px;border-radius:50%;border:10px solid #FFC23D;font-weight:900;font-size:150px;line-height:220px;color:#FFC23D;transform:scale(${lerp(.3,1,eb(kk))});${glow('#FFC23D',.7)}">1</div></div>`}
  else{const kk=prog(t,T.tunel-.05,.3),ki=prog(t,T.tunel+.25,.4);
   H+=`<div class="ab txt" style="left:0;right:0;top:${lerp(700,640,eo(kk))}px;text-align:center;opacity:${o*cl(kk*3)}"><div style="font-size:36px;letter-spacing:.3em;color:#0AC8B9;text-shadow:none">GİZLİ PASİF</div><div style="font-size:84px;line-height:1.1">TÜNEL <span class="y">GÖRÜŞÜ</span></div></div>`;
   // icon: real minion portrait from the reference, in our tunnel rings
   const rings=[0,1,2,3].map(i=>{const r=230-i*40+((t*60)%40);return `<circle cx="0" cy="0" r="${r}" fill="none" stroke="#0AC8B9" stroke-opacity="${.12+i*.18}" stroke-width="5"/>`}).join('');
   H+=`<div class="ab" style="left:300px;top:820px;width:480px;height:480px;opacity:${o*cl(ki*3)};transform:scale(${lerp(.4,1,eb(ki))})"><svg class="ab" style="left:0;top:0" width="480" height="480" viewBox="-240 -240 480 480">${rings}</svg><img src="assets/minion_portrait.png" style="position:absolute;left:90px;top:90px;width:300px;height:300px;border-radius:50%;border:8px solid #fff;box-shadow:0 0 30px rgba(10,200,185,.6)"></div>`;
  }
 }
 // 6) enemy chevron (covers src 20.9-21.7) and "!" over minions (covers cyan rings src 22.3-23.7)
 {const a=Math.max(T.rakip-.1,S(20.9)-.05),b=S(21.9);const k=env(t,a,b);if(k)H+=chevron(220,590,380,'#FF5A36',k,t)}
 {const a=S(22.2),b=S(23.8);if(t>=a&&t<=b){[[420,520],[560,700],[470,900],[640,1080],[430,1200]].forEach(([x,y],i)=>{const k=env(t,a+i*.06,b);H+=`<div class="ab" style="left:${x}px;top:${y+Math.sin(t*10+i)*8}px;transform:translate(-50%,-50%) scale(${lerp(.3,1,k)});opacity:${cl(k*2)};font-size:150px;line-height:1;color:#2D8CFF;-webkit-text-stroke:6px #fff;paint-order:stroke fill;${glow('#2D8CFF',.7)}">!</div>`})}}
 // 7) tunnel vignette while minions hit the turret
 if(t>=T.ama-.05&&t<T.sen){const k=prog(t,T.ama-.05,.4),out=prog(t,T.sen-.2,.2),o=cl(k)*(1-out);const r=lerp(900,430,eo(k));
  H+=`<div class="L" style="background:radial-gradient(circle at 540px 880px,transparent ${r}px,rgba(2,8,18,.88) ${r+160}px);opacity:${o}"></div><div class="ab" style="left:${540-r}px;top:${880-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;border:8px solid #0AC8B9;opacity:${o*.8};${glow('#0AC8B9',.5)}"></div>`}
 // 8) bubble (covers "Objectives first!" src 28.9-30.1) + chevron (covers src 30.9-32.1)
 {const a=S(28.85),b=S(30.2);const k=env(t,a,b);if(k)H+=bubble(490,255,640,540,'ÖNCE<br>OBJE!',k,92)}
 {const a=S(30.85),b=S(32.2);const k=env(t,a,b);if(k)H+=chevron(520,420,440,'#FFC23D',k,t)}
 // 9) cyan chevrons (cover src 32.9-33.6 and 38.9-39.8)
 {const a=S(32.85),b=S(34.2);const k=env(t,a,b);if(k)H+=chevron(240,820,420,'#0AC8B9',k,t)}
 {const a=S(38.7),b=S(40.7);const k=env(t,a,b);if(k)H+=chevron(560,560,420,'#0AC8B9',k,t)}
