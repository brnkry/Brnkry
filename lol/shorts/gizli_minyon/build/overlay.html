<div id="root">
 <div id="dyn" class="L"></div>
 <div id="cap"></div>
 <div id="tag"><span>FEEDLEME HOCAM</span></div>

<script src="words.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-cl(k),3);
const eb=k=>{k=cl(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const prog=(t,a,d)=>cl((t-a)/d);
const TR=s=>s.toLocaleUpperCase('tr');
const norm=s=>s.toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9%]/g,'');
const MISSING=[];
function C(w,n=1){let k=0;for(const x of WORDS){if(norm(x[2])===norm(w)&&++k===n)return x[0]}MISSING.push(w+n);return 0}
const SEG=[[0.0, 2.58, 3.2, 0, "freeze"], [2.58, 3.66, 3.9, 4.95, "play"], [3.66, 5.06, 8.1, 10.2, "play"], [5.06, 6.36, 5.0, 6.95, "play"], [6.36, 9.3, 10.2, 13.4, "play"], [9.3, 14.56, 20.2, 24.9, "blur"], [14.56, 19.54, 20.7, 24.9, "play"], [19.54, 22.88, 24.9, 28.6, "play"], [22.88, 25.94, 28.6, 32.4, "play"], [25.94, 31.62, 32.4, 39.2, "play"], [31.62, 35.44, 39.2, 43.6, "play"], [35.44, 39.8, 43.6, 49.4, "play"], [39.8, 44.92, 49.6, 55.0, "play"], [44.92, 46.52, 55.0, 57.2, "play"], [46.52, 50.9, 57.2, 63.0, "play"], [50.9, 53.5, 63.0, 66.4, "play"], [53.5, 57.12, 66.4, 69.4, "play"], [57.12, 59.78, 35.0, 37.66, "blur"], [59.78, 62.83, 24.9, 28.6, "play"], [62.83, 64.3, 40.0, 41.47, "blur"]];
// output time of a source time (first 'play' segment that contains it)
function S(src){for(const [a,b,s,e,m] of SEG){if(m==='play'&&src>=s&&src<=e)return a+(src-s)/(e-s)*(b-a)}return null}
function env(t,a,b,fi=.22,fo=.18){if(t<a||t>b)return 0;return Math.min(eb(prog(t,a,fi)),1-prog(t,b-fo,fo))}
function vis(t,a,b,fo=.15){return t>=a&&t<=b?Math.min(1,1-prog(t,b-fo,fo)):0}
const glow=(c,s=1)=>`filter:drop-shadow(0 0 ${10*s}px ${c}) drop-shadow(0 0 ${26*s}px ${c}) drop-shadow(0 6px 0 rgba(0,0,0,.6))`;
function bubble(x,y,w,h,txt,k,fs=70){return `<div class="ab" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:scale(${lerp(.3,1,k)}) rotate(-4deg);transform-origin:20% 100%;opacity:${cl(k*2)}"><div style="position:absolute;inset:0;background:#fff;border:7px solid #010A13;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:${fs}px;line-height:1.05;color:#010A13">${txt}</div><div style="position:absolute;left:${w*.18}px;top:${h-24}px;width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:70px solid #010A13;transform:rotate(18deg)"></div><div style="position:absolute;left:${w*.18+10}px;top:${h-34}px;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:56px solid #fff;transform:rotate(18deg)"></div></div>`}
function bigText(html,y,k,fs=90){return `<div class="ab txt" style="left:0;right:0;top:${y}px;text-align:center;font-size:${fs}px;line-height:1.08;transform:scale(${lerp(1.5,1,eo(k))});opacity:${cl(k*3)}">${html}</div>`}
// LoL style number ring (Beaufort numerals)
function ring(x,y,r,col,n,k){return `<div class="ab" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:radial-gradient(circle,#0a1626 55%,#050b14);border:9px solid ${col};box-shadow:0 0 0 4px #010A13,inset 0 0 26px ${col};display:flex;align-items:center;justify-content:center;transform:scale(${lerp(.3,1,k)});opacity:${cl(k*2)};${glow(col,.7)}"><span class="lol gold" style="font-size:${r*1.35}px;line-height:1;margin-top:${r*.08}px">${n}</span></div>`}
// confetti burst (deterministic particles)
const CONF=[...Array(110)].map((_,i)=>{const r=n=>{const x=Math.sin(i*127.1+n*311.7)*43758.5453;return x-Math.floor(x)};return {a:r(1)*Math.PI*2,v:600+r(2)*1000,c:['#FFC23D','#0AC8B9','#2D6BFF','#FF5A88','#FFF1D6','#9B6BFF'][i%6],w:14+r(3)*18,h:8+r(4)*10,s:(r(5)-.5)*14,d:r(6)*.12}});
function confetti(t,t0,cx,cy){const dt=t-t0;if(dt<0||dt>2.6)return '';return CONF.map(p=>{const tt=Math.max(0,dt-p.d);const f=(1-Math.exp(-tt*2.2))/2.2;const x=cx+Math.cos(p.a)*p.v*f;const y=cy+Math.sin(p.a)*p.v*f+420*tt*tt;const o=cl(1-(dt-1.8)/.8);return `<div class="ab" style="left:${x}px;top:${y}px;width:${p.w}px;height:${p.h}px;background:${p.c};border-radius:2px;transform:rotate(${p.s*tt*60}deg) scaleY(${Math.cos(tt*9+p.a)});opacity:${o}"></div>`}).join('')}
// ---------- cues
const T={l17:C('17'),p99:C('%99'),iki:C('iki'),mac:C('maç'),bir:C('birincisi'),tunel:C('tünel'),
 hep:C('hepimiz'),sen:C('sen',1),ama:C('ama',2),yani:C('yani',1),bedava:C('bedava'),bilmiyorsan:C('bilmiyorsan',1),p30:C('%30'),sadece2:C('sadece',2),
 yani2:C('yani',2),ama3:C('ama',4),roam:C('roam'),yoksa:C('yoksa'),tamami:C('tamamı'),peki:C('peki'),yorum:C('yorumlara'),bilmi2:C('bilmiyorsan',2),umurs:C('umursamıyordu'),end:62.83};
// ---------- captions (reference style: 1-2 words, Montserrat)
const KEY=/^(17|%|minyon|tünel|görüşü|gizli|kule|kill|bedava|altın|cannon|orta|mid|roam|kaplama|asla|sadece|ölüyor|izler|habersiz|umursa)/;
const FIX={rekip:'rakip',kililer:'killer',farkettirmeden:'fark ettirmeden',durüst:'dürüst',fidleme:'feedleme'};
const CH=[];{let cur=[];WORDS.forEach((w,i)=>{cur.push(w);const nx=WORDS[i+1];const len=cur.map(x=>x[2]).join(' ').length;if(/[,.?!:]$/.test(w[2])||cur.length>=2||len>11||!nx||nx[0]-w[1]>0.35){CH.push(cur);cur=[]}})}
function caption(t){let h='';for(let i=0;i<CH.length;i++){const a=CH[i][0][0],b=Math.min(CH[i+1]?CH[i+1][0][0]:99,CH[i][CH[i].length-1][1]+0.3);if(t>=a&&t<b){const k=prog(t,a,.1);
 h=`<span style="display:inline-block;transform:scale(${lerp(.75,1,eb(k))})">`+CH[i].map(w=>{let s=w[2].replace(/[,.:?!]$/,'');const n=norm(s);if(FIX[n])s=FIX[n];s=TR(s);return KEY.test(norm(s))?`<span class="y">${s}</span>`:s}).join(' ').replace(/ '/g,"'")+'</span>';break}}$('cap').innerHTML=h}
// Teemo path during "%99'u" (source 3.9 -> 4.95), final-frame coordinates
function teemo(src){const P=[[3.9,500,1330],[4.31,585,1265],[4.70,708,1170],[4.95,770,1110]];for(let i=0;i<P.length-1;i++){if(src<=P[i+1][0]){const k=(src-P[i][0])/(P[i+1][0]-P[i][0]);return [lerp(P[i][1],P[i+1][1],cl(k)),lerp(P[i][2],P[i+1][2],cl(k))]}}return [P[3][1],P[3][2]]}
// ---------- render
window.render=function(t){
 let H='';
 // 1) INTRO: LoL emblem -> 17 YIL with a confetti burst
 if(t<T.p99+.15){const out=prog(t,T.p99-.15,.25);
  const ke=eb(prog(t,0,.35)), k=prog(t,T.l17-.2,.35);
  const es=lerp(.3,1,ke)*lerp(1,.62,eo(k)), ey=lerp(0,140,eo(k));
  [0,1].forEach(i=>{const rk=prog(t,T.l17-.25+i*.08,.5);if(rk>0)H+=`<div class="ab" style="left:${540-260-i*40}px;top:${960-260-i*40+ey}px;width:${520+i*80}px;height:${520+i*80}px;border-radius:50%;border:${10-i*3}px solid ${i?'#0AC8B9':'#C8AA6E'};transform:scale(${lerp(.6,1,eo(rk))});opacity:${cl(rk*3)*(1-out)}"></div>`});
  H+=`<img class="ab" src="assets/lol_emblem.png" style="left:${540-215}px;top:${960-240+ey}px;width:430px;transform:scale(${es});opacity:${cl(ke*3)*(1-out)};filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))">`;
  const orbs=[[190,600,62,'#FFC23D'],[880,560,56,'#0AC8B9'],[230,1180,52,'#2D6BFF'],[860,1150,70,'#FFF1D6'],[150,880,40,'#0AC8B9'],[940,860,46,'#FFC23D'],[560,1260,46,'#2D6BFF']];
  H+=orbs.map(([x,y,r,c],i)=>{const b=Math.sin(t*2.2+i)*16;const kk=eb(prog(t,T.l17-.15+i*.05,.4))*(1-out);return `<div class="ab" style="left:${x-r}px;top:${y-r+b}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,${c} 38%,#00000088 100%);transform:scale(${kk});box-shadow:0 18px 30px rgba(0,0,0,.45)"></div>`}).join('');
  if(t>=T.l17-.2){const s=lerp(.2,1,eb(k)), o=cl(k*3)*(1-out);
   H+=`<div class="ab" style="left:0;right:0;top:470px;text-align:center;transform:scale(${s}) rotate(${-4+Math.sin(t*2)*2}deg);opacity:${o}">
   <div class="lol gold" style="font-size:400px;line-height:.9">17</div>
   <div class="lol" style="display:inline-block;margin-top:-6px;font-size:70px;color:#010A13;background:linear-gradient(180deg,#0AC8B9,#078a80);padding:0 40px 8px;border-radius:12px;border:5px solid #FFF1D6;transform:rotate(3deg)">YIL</div></div>`;}
  H+=confetti(t,T.l17-.2,540,760);
 }
 // 2) %99: the reference's 99% + arrow (pointing at Teemo) stay as they are
 // 3) 1 / 2 when the minions arrive (covers the reference's circles, LoL numerals)
 {const a=S(8.45),b=S(10.2);if(t>=a&&t<=b){H+=ring(190,785,118,'#C8AA6E','1',env(t,a,b))+ring(525,775,118,'#0AC8B9','2',env(t,a+.18,b))}}
 // 4) BOZGUN: the real Turkish defeat animation is keyed in by ffmpeg (compose step); only a soft red vignette here
 if(t>=T.mac-.15&&t<T.bir){const o=cl(prog(t,T.mac-.15,.3)*2)*(1-prog(t,T.bir-.2,.2));H+=`<div class="L" style="background:radial-gradient(ellipse at 50% 42%,transparent 35%,rgba(90,0,0,.55));opacity:${o}"></div>`}
 // 5) TÜNEL GÖRÜŞÜ card over blurred gameplay
 if(t>=T.bir-.05&&t<T.hep){const k=prog(t,T.bir-.05,.25),out=prog(t,T.hep-.2,.2),o=cl(k*3)*(1-out);
  H+=`<div class="L" style="background:radial-gradient(ellipse at 50% 50%,rgba(4,12,22,.25),rgba(2,6,12,.7) 75%);opacity:${o}"></div>`;
  if(t<T.tunel-.05){const kk=prog(t,T.bir,.25);H+=`<div class="ab" style="left:0;right:0;top:800px;text-align:center;opacity:${o}"><div style="display:inline-flex;width:250px;height:250px;border-radius:50%;border:10px solid #C8AA6E;background:rgba(5,12,22,.7);align-items:center;justify-content:center;transform:scale(${lerp(.3,1,eb(kk))});${glow('#C8AA6E',.5)}"><span class="lol gold" style="font-size:180px;line-height:1">1</span></div></div>`}
  else{const kk=prog(t,T.tunel-.05,.3),ki=prog(t,T.tunel+.25,.4);
   H+=`<div class="ab txt" style="left:0;right:0;top:${lerp(700,640,eo(kk))}px;text-align:center;opacity:${o*cl(kk*3)}"><div style="font-size:36px;letter-spacing:.3em;color:#0AC8B9">GİZLİ PASİF</div><div style="font-size:84px;line-height:1.1">TÜNEL <span class="y">GÖRÜŞÜ</span></div></div>`;
   const rings=[0,1,2,3].map(i=>{const r=230-i*40+((t*60)%40);return `<circle cx="0" cy="0" r="${r}" fill="none" stroke="#0AC8B9" stroke-opacity="${.12+i*.18}" stroke-width="5"/>`}).join('');
   H+=`<div class="ab" style="left:300px;top:820px;width:480px;height:480px;opacity:${o*cl(ki*3)};transform:scale(${lerp(.4,1,eb(ki))})"><svg class="ab" style="left:0;top:0" width="480" height="480" viewBox="-240 -240 480 480">${rings}</svg><img src="assets/minion_portrait.png" style="position:absolute;left:90px;top:90px;width:300px;height:300px;border-radius:50%;border:8px solid #fff;box-shadow:0 0 30px rgba(10,200,185,.6)"></div>`;
  }
 }
 // 6) tunnel vignette while minions hit the turret
 if(t>=T.ama-.05&&t<T.sen){const k=prog(t,T.ama-.05,.4),out=prog(t,T.sen-.2,.2),o=cl(k)*(1-out);const r=lerp(900,430,eo(k));
  H+=`<div class="L" style="background:radial-gradient(circle at 540px 880px,transparent ${r}px,rgba(2,8,18,.85) ${r+160}px);opacity:${o}"></div><div class="ab" style="left:${540-r}px;top:${880-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;border:8px solid #0AC8B9;opacity:${o*.8};${glow('#0AC8B9',.5)}"></div>`}
 // 7) ÖNCE OBJE! bubble (replaces "Objectives first!"), held until the section ends
 {const a=S(28.85),b=T.yani-.05;const k=env(t,a,b);if(k)H+=bubble(490,255,640,540,'ÖNCE<br>OBJE!',k,92)}
 // 8) + BEDAVA KİLL (straight, LoL font, lower middle)
 if(t>=T.bedava-.05&&t<T.bilmiyorsan){const k=prog(t,T.bedava-.05,.3),o=cl(k*3)*(1-prog(t,T.bilmiyorsan-.2,.2));
  H+=`<div class="ab" style="left:0;right:0;top:1120px;text-align:center;opacity:${o};transform:scale(${lerp(1.5,1,eb(k))})"><div style="display:inline-block;padding:10px 46px 14px;background:linear-gradient(180deg,rgba(10,22,38,.92),rgba(3,8,16,.92));border:4px solid #C8AA6E;border-radius:6px;box-shadow:0 0 30px rgba(200,170,110,.35)"><span class="lol gold" style="font-size:96px;line-height:1">+ BEDAVA KİLL</span></div></div>`}
 // 9) split screen: official lane icons + attack speed counters (cover the reference's), shown from the first frame
 {const a=S(49.6),b=S(55.0);if(t>=a&&t<=b){const o=1-prog(t,b-.12,.12);const up=lerp(1.0,1.3,eo(prog(t,T.p30,.6)));
  H+=`<div class="panel" style="left:432px;top:28px;width:216px;height:210px;opacity:${o};display:flex;flex-direction:column;align-items:center;justify-content:center"><img src="assets/pos_middle.png" style="width:120px;height:120px"><div class="lol" style="font-size:34px;color:#F0D58C;margin-top:4px">MID</div></div>`;
  H+=`<div class="panel" style="left:112px;top:538px;width:386px;height:136px;opacity:${o};display:flex;align-items:center;justify-content:center"><span class="lol gold" style="font-size:96px;line-height:1">${up.toFixed(2)}x</span></div>`;
  H+=`<div class="panel" style="left:432px;top:1238px;width:216px;height:210px;opacity:${o};display:flex;flex-direction:column;align-items:center;justify-content:center"><img src="assets/pos_top.png" style="width:120px;height:120px;filter:grayscale(.6)"><div class="lol" style="font-size:30px;color:#C8C8C8;margin-top:4px">DİĞER</div></div>`;
  H+=`<div class="panel" style="left:198px;top:1728px;width:320px;height:136px;opacity:${o};display:flex;align-items:center;justify-content:center"><span class="lol" style="font-size:96px;line-height:1;color:#E8E8E8">1.00x</span></div>`;
  if(t>=T.p30){const k=prog(t,T.p30,.3);H+=`<div class="ab lol" style="left:520px;top:540px;transform:scale(${lerp(1.8,1,eb(k))});opacity:${cl(k*3)*o};font-size:70px;color:#010A13;background:linear-gradient(180deg,#5FF0E2,#0AC8B9);padding:6px 22px 8px;border-radius:10px;border:4px solid #fff">+%30</div>`}}}
 // 10) SADECE MID'DE card: mid lane map + arrow along the lane
 {const a=S(55.0)-.05,b=T.yani2;if(t>=a&&t<b){const k=prog(t,a,.25),o=vis(t,a,b),ak=eo(prog(t,a+.15,.6)),tk=prog(t,T.sadece2-.05,.3);
  H+=`<div class="L" style="background:rgba(2,8,18,.94);opacity:${o}"></div>`;
  const x1=200,y1=480,x2=lerp(200,700,ak),y2=lerp(480,215,ak);
  H+=`<div class="ab" style="left:60px;top:${lerp(600,560,eo(k))}px;width:960px;height:800px;border-radius:24px;overflow:hidden;border:6px solid #C8AA6E;box-shadow:0 20px 50px rgba(0,0,0,.6);opacity:${o};transform:scale(${lerp(.85,1,eb(k))})">
   <img src="assets/midlane_map.webp" style="position:absolute;left:0;top:0;width:960px;height:800px">
   <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 48% 45%,transparent 35%,rgba(2,8,18,.55))"></div>
   <svg style="position:absolute;left:0;top:0;${glow('#FFC23D',.6)}" width="960" height="800"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FFC23D" stroke-width="22" stroke-linecap="round"/>
    <g transform="translate(${x2},${y2}) rotate(${Math.atan2(y2-y1,x2-x1)*180/Math.PI})" opacity="${ak>.05?1:0}"><path d="M-10 -38 L52 0 L-10 38Z" fill="#FFC23D" stroke="#fff" stroke-width="5"/></g></svg>
   <div class="lol gold" style="position:absolute;left:330px;top:430px;transform:rotate(-28deg) scale(${lerp(1.5,1,eb(tk))});transform-origin:0 0;opacity:${cl(tk*3)};font-size:84px;white-space:nowrap">SADECE MID'DE!</div></div>`;
 }}
 // 11) ROAM ATMA
 {const a=T.ama3,b=T.yoksa;if(t>=a&&t<b){const k=prog(t,T.roam-.3,.3),o=vis(t,a,b);
