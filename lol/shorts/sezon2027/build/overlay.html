<script>const tr=s=>String(s).replace(/İ/g,'<span class="ti dot">I</span>').replace(/Ğ/g,'<span class="ti brv">G</span>').replace(/Ş/g,'<span class="ti ced">S</span>').replace(/Â/g,'<span class="ti crc">A</span>').replace(/\./g,'<span class="ti pd">&#8203;</span>').replace(/%/g,'<span class="pc">%</span>');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,prog=(t,a,d)=>cl((t-a)/d);
const eo=k=>1-Math.pow(1-cl(k),3),eb=k=>{k=cl(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const env=(t,a,b,fi=.25,fo=.18)=>t<a||t>b?0:Math.min(eb(prog(t,a,fi)),1-prog(t,b-fo,fo));
const pop=(t,a,d=.3)=>`opacity:${cl(prog(t,a,d)*3)};transform:scale(${lerp(.5,1,eb(prog(t,a,d)))})`;
// captions: 2-3 word chunks
const KEY=/^(challenger|demir|iv|sen|mmr|panik|lp|zamansız|şanlı|arakçı|devdoğan|kader|cançiçeği|mezar|peri|aram|ultine|4|yorum|2027)/i;
const CH=[];{let cur=[];WORDS.forEach((x,i)=>{cur.push(x);const nx=WORDS[i+1];const len=cur.map(y=>y[2]).join(' ').length;const nlen=nx?len+1+nx[2].length:0;if(/[,.?!]$/.test(x[2])||cur.length>=3||nlen>17||!nx||nx[0]-x[1]>.3){CH.push(cur);cur=[]}})}
function caption(t){for(let i=0;i<CH.length;i++){const a=CH[i][0][0],b=Math.min(CH[i+1]?CH[i+1][0][0]:99,CH[i][CH[i].length-1][1]+.35);if(t>=a&&t<b){const k=prog(t,a,.12);
 return `<div class="cap" style="transform:scale(${lerp(.8,1,eb(k))})">`+CH[i].map(x=>{const s=x[2].replace(/[,.?!]$/,'').toLocaleUpperCase('tr');return KEY.test(x[2].replace(/['’].*/,''))?`<span class="y">${s}</span>`:s}).join(' ')+'</div>'}}return ''}
// headline strip under the channel tag
const HEAD=(t,a,b,txt,bg='#F4EFE6',fg='#0B0B0F',rot=-2)=>{const k=env(t,a,b,.28,.15);if(!k)return '';return `<div class="head" style="opacity:${cl(k*3)};transform:translateX(${(1-eo(prog(t,a,.3)))*-700}px) rotate(${rot}deg)"><span style="background:${bg};color:${fg}">${tr(txt)}</span></div>`};

const CHIP=(t,a,b,txt,y,rot=3,bg='#D4FF3A')=>{if(t<a||t>b)return '';return `<div class="ab" style="left:0;right:40px;top:${y}px;text-align:center;opacity:${cl((b-t)/.15)}"><span class="chip" style="background:${bg};transform:rotate(${rot}deg);${pop(t,a)}">${tr(txt)}</span></div>`};

 if(sg[2]==='CARD')O+=`<div class="ab" style="left:32px;top:${CY-8}px;width:1000px;height:563px;border:8px solid #D4FF3A;box-shadow:14px 16px 0 rgba(0,0,0,.6)"></div>`;

  if(t>=4.6){const k=prog(t,4.6,.22),f=prog(t,5.08,.3),flip=f<.5?f*2:(1-f)*2,img=f<.5?'ss_plat.png':'ss_iron.png';
   O+=`<div class="ab" style="left:${540-20-270}px;top:440px;width:540px;opacity:${cl(k*3)*A};transform:scale(${lerp(.4,1,eb(k))}) scaleX(${1-flip*.95})"><img src="assets/${img}" style="width:540px;border:6px solid ${f<.5?'#4fb3c8':'#8a8a8a'};box-shadow:14px 16px 0 rgba(0,0,0,.6)"></div>`;

   if(t>=5.08){const s=prog(t,5.08,.2);O+=`<div class="ab" style="left:0;right:40px;top:1180px;text-align:center;opacity:${A}"><span class="stamp" style="font-size:130px;color:#FF3B5C;transform:rotate(-8deg) scale(${lerp(3,1,eo(s))})">${tr('SEN DE!')}</span></div>`;
    O+=`<div class="ab" style="left:0;right:40px;top:1430px;text-align:center;font-family:Mon;font-weight:900;font-size:160px;line-height:1;color:#D4FF3A;-webkit-text-stroke:7px #0B0B0F;paint-order:stroke fill;opacity:${A};transform:translateY(${Math.sin(t*14)*14}px)">⬇</div>`}}}

 // ===== LP =====
