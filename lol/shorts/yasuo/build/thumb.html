<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
@font-face{font-family:AC;src:url(assets/fonts/american_captainttf)}
html,body{margin:0;background:#000}
.t{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.bg{position:absolute;background-repeat:no-repeat}
.ln{font-family:AC;line-height:.92;white-space:nowrap;text-align:center}
.ti,.ts{position:relative;display:inline-block}.ti i{position:absolute;top:-.16em;height:.12em;background:currentColor}
.ts b{position:absolute;left:50%;top:0;transform:translateX(-50%);font-weight:normal}
.sh{filter:drop-shadow(0 6px 0 rgba(0,0,0,.85)) drop-shadow(0 0 18px rgba(0,0,0,.9)) drop-shadow(0 0 40px rgba(0,0,0,.6))}
</style></head><body>
<div class="t" id="s">
 <div class="bg" style="left:0;top:0;width:1080px;height:1000px;background-image:url(../../../hikaye/yasuo/build/assets/thumb/yasuo_classic.jpg);background-size:4600px auto;background-position:-3006px -484px;filter:contrast(1.15) saturate(1.15) brightness(1.05)"></div>
 <div class="bg" style="left:0;top:920px;width:1080px;height:1000px;background-image:url(../../../hikaye/yasuo/build/assets/thumb/yone_sb.jpg);background-size:4000px auto;background-position:-1460px -112px;filter:contrast(1.1) saturate(1.1);clip-path:polygon(0 8%,100% 0,100% 100%,0 100%)"></div>
 <div style="position:absolute;left:-60px;top:930px;width:1200px;height:22px;transform:rotate(-4.3deg);background:linear-gradient(180deg,rgba(255,60,40,0),#ffd2b8 45%,#fff 50%,#ffd2b8 55%,rgba(255,60,40,0));box-shadow:0 0 40px 16px rgba(255,40,20,.85),0 0 130px 44px rgba(255,30,10,.5)"></div>
 <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 45%)"></div>
 <div style="position:absolute;left:150px;width:780px;top:790px">
  <div class="ln sh" data-t="ABİSİNİ ÖLDÜRDÜ" style="font-size:118px;color:#F7EFE2"></div>
  <div class="ln sh" data-t="AMA SUÇSUZDU" style="font-size:134px;color:#FF3B30;margin-top:70px"></div>
 </div>
</div>
<script>
const tr=s=>s.replace(/İ/g,'<span class="ti">I<i></i></span>').replace(/Ş/g,'<span class="ts">S<b>Ç</b><u></u></span>');
document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=tr(e.dataset.t));
window.ready=document.fonts.load('100px AC','AIS').then(()=>{const c=document.createElement('canvas');c.width=600;c.height=400;const x=c.getContext('2d');
 document.querySelectorAll('.ti').forEach(s=>{const fs=parseFloat(getComputedStyle(s).fontSize);x.clearRect(0,0,600,400);x.font=fs+'px AC';x.fillText('I',50,300);
  const d=x.getImageData(0,0,600,400).data;let l=600,r=0;for(let px=0;px<600;px++)for(let py=0;py<400;py++)if(d[(py*600+px)*4+3]>128){l=Math.min(l,px);r=Math.max(r,px)}
  const i=s.querySelector('i');i.style.left=(l-50)+'px';i.style.width=(r-l+1)+'px'});
 document.querySelectorAll('.ts').forEach(s=>{const u=s.querySelector('u');u.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';s.querySelector('b').style.clipPath=`inset(${u.offsetTop+2}px -40px -80px -40px)`})});
</script></body></html>
