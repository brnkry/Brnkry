</style></head><body>
<div id="root">
 <div id="bg"><svg width="1080" height="1920"><ellipse id="rng" cx="800" cy="632" rx="528" ry="432" fill="rgba(255,214,120,.07)" stroke="#F2CF73" stroke-width="5"/></svg></div><div id="shade"></div><div id="dim"></div>
 <div class="top"><div class="brand"><b>4</b>DAKİKADA FEEDLEME</div><div class="chip">FEEDLEME DERSİ #1</div></div>
 <div id="head"></div>
 <div id="arena">
  <div id="ground"></div><div id="lane"></div>
  <svg id="sv" width="1000" height="760">
   <defs>
    <radialGradient id="rg"><stop offset="0" stop-color="#FF3B4E" stop-opacity="0"/><stop offset=".82" stop-color="#FF3B4E" stop-opacity=".05"/><stop offset="1" stop-color="#FF3B4E" stop-opacity=".28"/></radialGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#FFC23D"/><stop offset="1" stop-color="#FF3B4E"/></linearGradient>
    <radialGradient id="cry" cx=".5" cy=".4"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#FFB15C"/><stop offset="1" stop-color="#C2182B"/></radialGradient>

   </defs>
   <circle id="range" opacity="0" cx="500" cy="290" r="300" fill="url(#rg)" stroke="#FF3B4E" stroke-width="5" stroke-dasharray="22 14"/>
   <circle id="glow" cx="389.9" cy="242.8" r="20" fill="#FF6B5E" opacity=".35" style="filter:blur(6px)"/>

  </svg>
  <div id="ents"></div>
  <div id="pops"></div>

 </div>

</div>
<script src="words.js"></script>
<script src="env.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-cl(k),3);
const eb=k=>{k=cl(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const prog=(t,a,d)=>cl((t-a)/d);
const TR=s=>s.toLocaleUpperCase('tr');
const norm=s=>s.toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9%]/g,'');
function C(w,n=1){let k=0;for(const x of WORDS){if(norm(x[2])===norm(w)&&++k===n)return x[0]}MISSING.push(w+n);return 0}
const MISSING=[];
const END=45.0;
// ---------- cues
const T={
 lock0:0.75, h1:C('3'), h2:C('vuruşta'), h3:C('yere'), dead:C('serdim'), kizma:C('kızma'),
 k1:C('kural',1), minyon1:C('minyonlara'), lock1:C('menzilime'), olene:C('ölene'),
 k2:C('kural',2), quiz:10.10, qend:12.62, sana:C('sana'), donerim:C('dönerim'),
 k3:C('kural',3), vurusum:C('vuruşum'), ikinci:C('ikincisi'), ucuncu:C('üçüncüsü'), acitir:C('acıtır'),
 peki:C('peki'), gir:C('gir',1), sart:C('şartlarım'),
 menzil:C('menzilin'), durt1:C('dürt',1), ben:C('ben',2), bitir:C('bitirebiliyorsan'),
 takim:C('takımınla'), tank:C('tank'), dive:C('dive'),
 bana:C('bana'), lazim:C('lazım'), yaninda:C('yanında'), yoksa:C('yoksa'), y80:C('%80',2), bosa:C('boşa'),
 ozet:C('özetle'), s1:C('minyonlar'), s2:C('dürt',2), s3:C('öldüremiyorsan'),
 cta:C('bunu'), gonder:C('gönder'), endc:43.55
};
// scene boundaries
const SC=[['hook',0,T.k1],['r1',T.k1,T.k2],['r2',T.k2,T.k3],['r3',T.k3,T.peki],['gir',T.peki,T.menzil],['c1',T.menzil,T.ben],['c2',T.ben,T.takim],['c3',T.takim,T.bana],['mn',T.bana,T.ozet],['sum',T.ozet,T.cta],['cta',T.cta,T.endc],['end',T.endc,99]];
const scene=t=>SC.find(s=>t>=s[1]&&t<s[2])||SC[SC.length-1];
// ---------- SFX timeline (exported for the mixer)
const SFX=[];
const sfx=(n,t,g=0)=>SFX.push([n,+t.toFixed(3),g]);
// ---------- entities
const ents={};
function mkEnt(id,champ,en,label){const d=document.createElement('div');d.className='ent'+(en?' en':'');d.innerHTML=`<div class="hp"><i></i></div><div class="ic" style="background-image:url(assets/champ_${champ}.png)"></div><div class="nm">${label}</div>`;$('ents').appendChild(d);ents[id]=d;return d}
mkEnt('sett','Sett',0,'SEN');mkEnt('lux','Lux',1,'RAKİP');mkEnt('malph','Malphite',0,'TANK');mkEnt('cait','Caitlyn',0,'SEN');
const MN=[];for(let i=0;i<8;i++){const d=document.createElement('div');d.className='mn'+(i>=4?' en':'');$('ents').appendChild(d);MN.push(d)}
function setEnt(id,x,y,o=1,hp=1,s=1,grey=0){const d=ents[id];d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=o;d.style.transform=`rotate(-62deg) scale(${s*.8})`;d.querySelector('.hp i').style.width=(cl(hp)*100)+'%';d.querySelector('.ic').style.filter=grey?`grayscale(${grey}) brightness(${1-grey*.4})`:'none';d.style.display=o>0?'block':'none'}
const TW={x:389.9,y:242.8}; // crystal position in arena
let beamsHTML='',popsHTML='',sv2='';
function beam(t,t0,tx,ty,big=1){const k=(t-t0)/0.28;if(k<0||k>1)return 0;const w=(22*big)*(1-k);beamsHTML+=`<line x1="${TW.x}" y1="${TW.y}" x2="${tx}" y2="${ty}" stroke="url(#beam)" stroke-width="${w}" stroke-linecap="round" opacity="${1-k*.5}"/><circle cx="${tx}" cy="${ty}" r="${30+90*k}" fill="none" stroke="#FFC23D" stroke-width="${10*(1-k)}"/><circle cx="${tx}" cy="${ty}" r="${50*(1-k)}" fill="#FFF1C2" opacity="${1-k}"/>`;return 1-k}
function burst(x,y,sz,o){return `<div style="position:absolute;left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px;opacity:${o};background:radial-gradient(circle,#FFF8EC 0,#FFC23D 45%,#FF3B4E 80%);clip-path:polygon(50% 0,61% 32%,95% 20%,72% 48%,100% 62%,66% 66%,72% 100%,50% 74%,26% 100%,32% 66%,0 62%,28% 48%,5% 20%,39% 32%)"></div>`}
function pop(t,t0,x,y,txt,col='#FFF8EC',size=64,dur=1.1){const k=(t-t0)/dur;if(k<0||k>1)return;const s=k<.15?eb(k/.15):1;popsHTML+=`<div class="pop" style="left:${x}px;top:${y-60*eo(k)}px;color:${col};font-size:${size}px;opacity:${k>.75?(1-k)/.25:1};transform:translate(-50%,-50%) scale(${s})">${txt}</div>`}
function ret(t,x,y,o){const g=$('ret');g.setAttribute('opacity',o);g.setAttribute('transform',`translate(${x},${y}) rotate(${t*90})`)}
// minion formation: blue at lane bottom moving up, red near tower
function minions(t,mode,t0){
 for(let i=0;i<8;i++){const d=MN[i];let x,y,o=1;
  const bl=i<4, j=i%4;
  if(bl){const k=eo(prog(t,t0,1.6));x=430+j*46;y=lerp(820,470+(j%2)*26,k)}
  else{x=430+j*46;y=372+(j%2)*24}
  if(mode==='none')o=0;
  if(mode==='blueonly'&&!bl)o=0;
  d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=o;d.dataset.x=x;d.dataset.y=y}
}
// ---------- headings
let lastHead='';
function head(html){if(html!==lastHead){$('head').innerHTML=html;lastHead=html}}
function headAnim(t,t0){const k=prog(t,t0,.35);$('head').style.transform=`translateY(${(1-eo(k))*-40}px) scale(${lerp(.85,1,eb(k))})`;$('head').style.opacity=cl(k*3)}
// ---------- captions
const KEY=/^(kural|minyon|kule|şampiyon|sert|gir|dürt|çık|tank|dive|öldür|%|3|1|2|sana|dönerim|rakib|takım|vuruş|bitirebiliyorsan|girme|boşa|önde|gönder)/;
const CH=[];{let cur=[];WORDS.forEach((w,i)=>{cur.push(w);const txt=cur.map(x=>x[2]).join(' ');const last=/[,.?!:]$/.test(w[2]);const nx=WORDS[i+1];if(last||(nx&&/^[A-ZÇĞİÖŞÜ]/.test(nx[2]))||cur.length>=3||txt.length>16||!nx||(nx&&nx[0]-w[1]>0.5)){CH.push(cur);cur=[]}})}
function caption(t){let html='';for(let i=0;i<CH.length;i++){const a=CH[i][0][0],b=Math.min(CH[i+1]?CH[i+1][0][0]:99,CH[i][CH[i].length-1][1]+0.35);if(t>=a&&t<b){const k=prog(t,a,.12);html=`<span style="display:inline-block;transform:scale(${lerp(.8,1,eb(k))})">`+CH[i].map(w=>{const n=norm(w[2]);const s=TR(w[2].replace(/^'/,"'")).replace(/[,.:]$/,'');return KEY.test(n)?`<span class="y" style="font-size:inherit">${s}</span>`:s}).join(' ').replace(/ '/g,"'")+'</span>';break}}$('cap').innerHTML=html}
// ---------- main render
let shake=0;
window.render=function(t){
 beamsHTML='';popsHTML='';sv2='';shake=0;
 const [sc,s0,s1]=scene(t);
 const env=ENV[Math.min(ENV.length-1,Math.floor(t*30))]||0;
 // background drift
 
 // defaults
 for(const k in ents)setEnt(k,0,0,0);
 $('over').innerHTML='';$('gauge').innerHTML='';
 let arenaO=1, retO=0, rx=0, ry=0, shieldR=0, rangeO=1, heat=0, zoom=1;
 const S=ents;
 // ---- HOOK
 if(sc==='hook'){
  head(`<div class="h1">SELAM,<br><span class="y">BEN KULEYİM.</span></div>`);headAnim(t,0);
  if(t>=T.kizma){head(`<div class="h2">KIZMA,</div><div class="h1 y">KURALLARIM BELLİ</div>`);headAnim(t,T.kizma)}
  minions(t,'none',0);
  const sx=lerp(680,560,eo(prog(t,0,.6))), sy=lerp(520,430,eo(prog(t,0,.6)));
  const hits=[T.h1,T.h2,T.h3].filter(h=>t>=h).length;
  const g=cl((t-T.dead)/.4);
  setEnt('sett',sx,sy,1,1-hits*.34,1,g);
  setEnt('lux',380,420,1,.9);
  if(t>=T.lock0){retO=1;rx=sx;ry=sy}
  [T.h1,T.h2,T.h3].forEach((h,i)=>{const b=beam(t,h,sx,sy,1+i*.3);if(b)shake=Math.max(shake,b*10*(1+i*.5));pop(t,h,sx+110+i*70,sy-40,(i+1)+'!',i==2?'#FF3B4E':'#FFC23D',90,.9)});
  if(t>=T.dead){const k=prog(t,T.dead,.25);popsHTML+=`<div class="pop" style="left:${sx}px;top:${sy+150}px;font-size:84px;color:#FF3B4E;transform:translate(-50%,-50%) rotate(-8deg) scale(${lerp(2,1,eo(k))});opacity:${cl(k*3)};border:8px solid #FF3B4E;padding:0 20px;border-radius:12px;background:rgba(1,10,19,.8)">FEEDLEDİN</div>`;retO=1-g}
  zoom=lerp(1.08,1,eo(prog(t,0,1.2)));
 }
 // ---- RULE 1
 if(sc==='r1'){
  head(`<div class="tag">KURAL 1</div><div class="h1">ÖNCE <span class="y">MİNYON</span></div>`);headAnim(t,T.k1);
  minions(t,'all',T.k1+.1);
  setEnt('sett',700,500,1,.75);
  setEnt('lux',380,420,1,.9);
  const m0=MN[0], m1=MN[1];
  const dead0=t>=T.olene+.35;
  if(dead0)m0.style.opacity=cl(1-(t-T.olene-.35)/.2);
  const tgt=dead0?m1:m0;
  if(t>=T.lock1){retO=1;rx=+tgt.dataset.x;ry=+tgt.dataset.y}
  for(let h=T.lock1+.35;h<s1;h+=.62){beam(t,h,+(h<T.olene+.35?m0:m1).dataset.x,+(h<T.olene+.35?m0:m1).dataset.y,.7)}
  if(t>=T.lock1)pop(t,T.lock1,+m0.dataset.x,+m0.dataset.y-80,'İLK GİREN','#FFC23D',54,1.6);
 }
 // ---- RULE 2 + QUIZ
 if(sc==='r2'){
  if(t<T.qend){head(`<div class="tag">KURAL 2</div><div class="h1">ALTIMDA <span class="r">KAVGA</span></div>`);headAnim(t,T.k2)}else{head(`<div class="tag">KURAL 2</div><div class="h2">ŞAMPİYONUMA VURURSAN</div><div class="h1 r">SANA DÖNERİM</div>`);headAnim(t,T.qend)}
  minions(t,'all',-10);
  const sIn=eo(prog(t,T.k2+.1,.45));
  const sx=lerp(700,660,sIn), sy=lerp(520,420,sIn);
  const hitL=T.k2+.62;
  setEnt('lux',380,420,1,t>hitL?.6:.9);
  setEnt('sett',sx,sy,1,1);
  if(t>=hitL&&t<hitL+.3){const k=(t-hitL)/.3;sv2+=`<path d="M${sx-40} ${sy-20} L 390 420" stroke="#FFC23D" stroke-width="${16*(1-k)}" stroke-linecap="round"/>`;popsHTML+=burst(380,420,150+80*k,1-k);shake=8*(1-k)}
  const onSett=t>=T.qend;
  retO=1;
  if(onSett){rx=sx;ry=sy}else{rx=+MN[0].dataset.x;ry=+MN[0].dataset.y}
  if(!onSett)for(let h=T.k2+.2;h<T.quiz;h+=.62)beam(t,h,rx,ry,.7);
  if(onSett){for(let h=T.qend+.35;h<s1;h+=.8){const b=beam(t,h,sx,sy,1);if(b)shake=Math.max(shake,b*8)}
   const k=prog(t,T.qend,.3);popsHTML+=`<div class="pop" style="left:600px;top:560px;font-size:76px;color:#FFF8EC;background:#FF3B4E;padding:4px 26px 10px;border-radius:12px;transform:translate(-50%,-50%) scale(${lerp(1.6,1,eb(k))});opacity:${cl(k*4)*(t>T.k3-.3?0:1)}">⚠ HEDEF DEĞİŞTİ</div>`}
  // quiz overlay
  if(t>=T.quiz&&t<T.qend+.25){
   const k=prog(t,T.quiz,.3), out=prog(t,T.qend,.25);
   const n=t<T.quiz+.85?3:t<T.quiz+1.7?2:1;
   const nk=prog(t,T.quiz+(3-n)*.85,.25);
   arenaO=1-.65*k;
   $('over').innerHTML=`<div style="position:absolute;left:0;right:0;top:640px;text-align:center;opacity:${(1-out)*cl(k*3)};transform:scale(${lerp(.8,1,eb(k))})">
