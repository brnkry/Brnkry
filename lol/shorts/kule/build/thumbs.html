<!doctype html>

html,body{margin:0;background:#000}
.th{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Ant;color:#FFF8EC}
.bg{position:absolute;left:0;top:220px;width:1080px;height:1920px;background:url(assets/midlane.jpg) 0 0/1080px 1920px no-repeat}

svg{position:absolute;left:0;top:0}
.t{position:absolute;left:0;right:0;text-align:center;text-transform:uppercase;line-height:1.14;text-shadow:0 9px 0 #000,0 0 40px rgba(0,0,0,.9)}
.y{color:#FFC23D}.r{color:#FF3B4E}.c{color:#0AC8B9}

.brand b{font-weight:400;color:#FFC23D;font-size:70px;display:inline-block;transform:skewX(-10deg);margin-right:8px}
.chip{display:inline-block;font-family:Osw;font-weight:700;font-size:40px;letter-spacing:.14em;color:#010A13;background:#0AC8B9;padding:6px 22px 10px;border-radius:8px}
.opt{position:absolute;width:390px;height:300px;border-radius:30px;border:8px solid #C8AA6E;background:rgba(10,24,40,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:72px;text-shadow:0 6px 0 #000}
