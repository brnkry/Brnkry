<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
@font-face{font-family:PB;src:url(assets/fonts/punkboy_bi.otf)}
@font-face{font-family:Mon;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;background:transparent;overflow:hidden}
.ti{position:relative;display:inline-block;line-height:.9}
.ti.dot:after{content:'';position:absolute;left:54%;bottom:1.0em;width:.19em;height:.16em;background:currentColor;border-radius:40% 55% 45% 50%;transform:translateX(-50%) rotate(-12deg)}
.ti.brv:after{content:'';position:absolute;left:54%;bottom:.92em;width:.4em;height:.17em;border:.1em solid currentColor;border-top:0;border-radius:0 0 .3em .3em;transform:translateX(-50%) rotate(-8deg)}
.ti.ced:after{content:'Ç';position:absolute;left:0;right:0;top:0;text-align:center;clip-path:inset(86% -20% -80% -20%);transform:translateX(-.02em)}
#t{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:PB;color:#F4EFE6;background:url(assets/thumb_bg.jpg) 0 0/1080px 1920px no-repeat}
</style></head><body><div id="t">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.55),rgba(11,11,15,.15) 25%,rgba(11,11,15,.4) 38%,rgba(11,11,15,.85) 55%,rgba(11,11,15,.9))"></div>
<div style="position:absolute;left:0;right:0;top:170px;text-align:center"><span style="font-size:36px;letter-spacing:.06em;padding:6px 20px 2px;background:rgba(11,11,15,.75);border-radius:8px">FEEDLEME HOCAM</span></div>
<img src="assets/lol_logo.png" style="position:absolute;left:110px;width:860px;top:720px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.9))">
<div style="position:absolute;left:0;right:0;top:1100px;text-align:center"><div style="display:inline-block;transform:rotate(-3deg);box-shadow:14px 16px 0 rgba(0,0,0,.65);background:#D4FF3A;color:#0B0B0F;padding:26px 46px 6px;white-space:nowrap">
 <span style="position:relative;display:inline-block;font-size:230px;line-height:1.05;vertical-align:middle">2</span>
 <span class="t" style="display:inline-block;font-size:150px;line-height:1.3;vertical-align:middle;padding-top:.12em">Mİ</span>
 <div class="t" style="font-size:150px;line-height:1.3;padding-top:.1em">GELİYOR?</div></div></div>
</div><script>const tr=s=>String(s).replace(/İ/g,'<span class="ti dot">I</span>').replace(/Ğ/g,'<span class="ti brv">G</span>').replace(/Ş/g,'<span class="ti ced">S</span>');
document.querySelectorAll('.t').forEach(e=>e.innerHTML=tr(e.textContent));</script></body></html>
