window.inkCenter=()=>{const c=document.createElement('canvas').getContext('2d');document.querySelectorAll('svg.ink4').forEach(svg=>{const t=svg.querySelector('text');const sz=+svg.dataset.size;t.setAttribute('font-size',sz);c.font=`900 ${sz}px Cin`;const m=c.measureText('4');const cx=+svg.dataset.cx,cy=+svg.dataset.cy;t.setAttribute('x',cx-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2);t.setAttribute('y',cy+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2)})};
</script></body></html>
