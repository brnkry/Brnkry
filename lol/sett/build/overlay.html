<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Osw;src:url(node_modules/@fontsource-variable/oswald/files/oswald-latin-ext-wght-normal.woff2) format('woff2');font-weight:200 700;unicode-range:U+0100-024F,U+0130-0131,U+015E-015F,U+011E-011F}
@font-face{font-family:Osw;src:url(node_modules/@fontsource-variable/oswald/files/oswald-latin-wght-normal.woff2) format('woff2');font-weight:200 700}
@font-face{font-family:Int;src:url(node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0100-024F,U+0130-0131,U+015E-015F,U+011E-011F}
@font-face{font-family:Int;src:url(node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
:root{--gold:#F4B942;--purple:#A66BFF;--ink:rgba(13,9,22,.94);--cream:#F7F1E8;--red:#FF4D5E;--green:#3EE08F;--smoke:#A79FB5}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:absolute;inset:0;font-family:Osw;color:var(--cream)}
.abs{position:absolute}
.hide{display:none}
.panel{background:var(--ink);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
/* badge */
.badge{left:66px;top:94px;width:610px;height:214px;display:flex;align-items:center;gap:22px;padding:0 26px;box-sizing:border-box;border:3px solid rgba(244,185,66,.55)}
.badge .key{width:128px;height:128px;border-radius:16px;background:linear-gradient(160deg,#2a1d45,#130c22);border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:700;color:var(--gold);flex:none}
.badge .key.small{font-size:44px}
.badge img{width:104px;height:104px;border-radius:12px;border:3px solid rgba(255,255,255,.25);flex:none}
.badge .txt{display:flex;flex-direction:column;line-height:1}
.badge .sub{font-family:Int;font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--smoke);margin-bottom:10px}
.badge .nm{font-size:52px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
/* chips */
.chips{left:70px;top:330px;width:900px}
.chip{display:inline-flex;align-items:center;gap:14px;background:var(--ink);border-radius:12px;padding:12px 24px 14px 18px;margin-bottom:16px;font-size:38px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;border-left:8px solid var(--gold);transform-origin:left center}
.chip.red{border-left-color:var(--red)}.chip.green{border-left-color:var(--green)}.chip.purple{border-left-color:var(--purple)}
.chip b{color:var(--gold);font-weight:700}
.chipwrap{display:block}
/* grit bar */
.grit{left:660px;top:36px;width:600px;height:86px;padding:14px 22px;box-sizing:border-box}
.grit .lbl{font-size:26px;font-weight:700;letter-spacing:.14em;color:var(--gold);display:flex;justify-content:space-between}
.grit .bar{margin-top:8px;height:20px;border-radius:10px;background:#2a2238;overflow:hidden}
.grit .fill{height:100%;width:0;background:linear-gradient(90deg,#ff9b3d,#ffd36b);box-shadow:0 0 18px #ffb347}
/* passive card */
.pcard{left:584px;top:672px;width:756px;height:270px;padding:22px 28px;box-sizing:border-box;border:3px solid rgba(166,107,255,.6)}
.pcard .hd{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:700}
.pcard .hd img{width:62px;height:62px;border-radius:10px}
.pcard .ln{font-family:Int;font-size:28px;font-weight:600;margin-top:14px;line-height:1.25}
.pcard .ln b{color:var(--gold)}
/* combo band */
.band{left:0;top:822px;width:1920px;height:258px;background:linear-gradient(180deg,rgba(10,7,18,.0) 0,rgba(10,7,18,.97) 14%,rgba(10,7,18,.99) 100%)}
.band .ttl{position:absolute;left:70px;top:44px;font-size:34px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.band .row{position:absolute;left:70px;top:96px;display:flex;align-items:center;gap:16px}
.step{width:124px;height:124px;border-radius:16px;background:#1d1530;border:4px solid #3a2f52;display:flex;align-items:center;justify-content:center;position:relative;opacity:.3}
.step img{width:108px;height:108px;border-radius:10px}
.step .k{position:absolute;left:-10px;top:-14px;background:var(--gold);color:#140c22;font-weight:700;font-size:28px;border-radius:8px;padding:0 10px}
.step.auto{width:150px;font-size:36px;font-weight:700;color:var(--cream);background:#3a1220;border-color:#6d2433;text-align:center;line-height:1}
.step.on{opacity:1;border-color:var(--gold);box-shadow:0 0 26px rgba(244,185,66,.55)}
.arrow{font-size:52px;color:var(--smoke);font-weight:700}
/* full scenes */
.scene{left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#0b0813}
.scene .bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(14px) brightness(.32) saturate(1.2)}
.scene .title{position:absolute;left:0;right:0;top:56px;text-align:center;font-size:96px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.scene .title span{color:var(--gold)}
.tag{position:absolute;font-family:Int;font-weight:800;letter-spacing:.2em;font-size:26px;color:var(--smoke)}
.card{position:absolute;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0}
.card img{width:150px;height:150px;border-radius:18px;border:4px solid rgba(255,255,255,.2);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.card .n{font-size:32px;font-weight:600;text-align:center;line-height:1.05;max-width:230px}
.card.lg img{width:200px;height:200px}
.side{position:absolute;top:220px;width:560px;height:660px;border-radius:26px;padding:30px;box-sizing:border-box;opacity:0}
.side h2{margin:0;font-size:84px;line-height:1;letter-spacing:.04em}
.side .cap{font-family:Int;font-size:34px;font-weight:700;margin-top:30px;line-height:1.3}
.side .icons{display:flex;gap:22px;margin-top:34px}
.side .icons img{width:146px;height:146px;border-radius:16px;border:4px solid rgba(255,255,255,.3);opacity:0}
.grid{position:absolute;left:170px;top:300px;border-collapse:separate;border-spacing:8px}
.grid td{width:72px;height:72px;border-radius:10px;background:#1b1429;text-align:center;font-size:36px;font-weight:700;color:#140c22}
.grid td.hd{background:transparent;color:var(--smoke);font-size:28px;height:40px}
.grid td.ic{background:transparent;width:90px}
.grid td.ic img{width:80px;height:80px;border-radius:10px;display:block}
.grid td.on{background:var(--gold)}
.grid td.on.r{background:var(--purple);color:#fff}
.banner{left:0;right:0;top:400px;text-align:center}
.banner div{display:inline-block;font-size:130px;font-weight:700;letter-spacing:.06em;padding:10px 60px 20px;background:var(--ink);border-radius:24px;border-bottom:10px solid var(--gold)}
.phase{left:0;right:0;top:28px;text-align:center}
.phase div{display:inline-block;font-size:30px;font-weight:700;letter-spacing:.2em;padding:6px 26px 8px;background:var(--ink);border-radius:12px;color:var(--gold)}
.big{left:0;right:0;text-align:center;font-size:110px;font-weight:700;text-transform:uppercase;text-shadow:0 8px 30px rgba(0,0,0,.7);line-height:1.05}
.dim{left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at center,rgba(8,5,14,.45),rgba(8,5,14,.85))}
.sub{left:0;right:0;top:780px;text-align:center}
.subbtn{display:inline-flex;align-items:center;gap:20px;background:#E62117;color:#fff;font-size:64px;font-weight:700;padding:16px 54px 22px;border-radius:18px;letter-spacing:.04em}
</style></head>
<body><div id="root"></div>
<script>
const A='assets/';
const root=document.getElementById('root');
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;root.appendChild(e);return e}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eb=x=>{x=clamp(x);const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// generic show: element visible in [t0,t1], kind of entrance
function show(el,t,t0,t1,kind='pop',dur=.32){
  if(t<t0||t>=t1){el.style.display='none';return false}
  el.style.display='';
  const a=(t-t0)/dur, o=clamp((t1-t)/.22);
  let tf='';
  if(kind==='pop') tf=`scale(${.7+.3*eb(a)})`;
  else if(kind==='slideL') tf=`translateX(${-70*(1-eo(a))}px)`;
  else if(kind==='slideR') tf=`translateX(${70*(1-eo(a))}px)`;
  else if(kind==='up') tf=`translateY(${50*(1-eo(a))}px)`;
  else if(kind==='drop') tf=`translateY(${-60*(1-eo(a))}px)`;
  el.style.transform=tf; el.style.opacity=Math.min(clamp(a*1.6),o);
  return true
}
const items=[]; // {el, t0, t1, kind}
function add(el,t0,t1,kind){items.push({el,t0,t1,kind});return el}

/* ---------- SECTION TIMES ---------- */
const T={intro:[0,14.40],passive:[14.40,31.22],q:[31.22,40.40],w:[40.40,58.68],e:[58.68,67.90],r:[67.90,83.48],
combo:[83.48,98.26],match:[98.26,110.52],runes:[110.52,120.40],items:[120.40,131.95],skills:[131.95,142.17],summ:[142.17,144.72],
early:[144.72,187.66],late:[187.66,211.90],outro:[211.90,240.5]};

/* ---------- INTRO ---------- */
const intro=add(h(`<div class="abs scene" style="background:#000"></div>`),...T.intro,'none');
const kb=[['splash_0.jpg',0,5.2],['splash_8.jpg',4.8,10],['splash_45.jpg',9.6,14.6]].map(([f,a,b])=>{const e=document.createElement('div');e.className='abs';e.style.cssText=`inset:0;background:url(${A}${f}) center/cover`;intro.appendChild(e);return [e,a,b]});
intro.insertAdjacentHTML('beforeend',`<div class="abs" style="inset:0;background:linear-gradient(90deg,rgba(8,5,14,.88) 0,rgba(8,5,14,.25) 38%,rgba(8,5,14,.25) 62%,rgba(8,5,14,.88) 100%),linear-gradient(0deg,rgba(8,5,14,.9) 0,rgba(8,5,14,0) 40%)"></div>`);
const introTitle=h(`<div class="abs big" style="top:850px;font-size:150px;letter-spacing:.04em">NEDEN <span style="color:var(--gold)">SETT?</span></div>`);intro.appendChild(introTitle);
const introTag=h(`<div class="abs tag" style="left:0;right:0;top:820px;text-align:center">ÜST KORİDOR REHBERİ</div>`);intro.appendChild(introTag);
function listCol(x,title,color,rows){const c=h(`<div class="abs" style="left:${x}px;top:120px;width:560px"></div>`);intro.appendChild(c);
  const t=h(`<div style="font-size:64px;font-weight:700;letter-spacing:.08em;color:${color};margin-bottom:18px">${title}</div>`);c.appendChild(t);
  const rs=rows.map(([txt,t0])=>{const r=h(`<div class="chip ${color==='var(--green)'?'green':'red'}" style="font-size:40px">${txt}</div>`);const w=document.createElement('div');w.className='chipwrap';w.appendChild(r);c.appendChild(w);return [r,t0]});
  return [t,rs]}
const pros=listCol(70,'ARTILAR','var(--green)',[['Doğuştan tank',2.5],['Dev alan kontrolü',3.84],['Split push + takım savaşı',5.46],['Tek hamlede takım siler',8.28]]);
const cons=listCol(1290,'EKSİLER','var(--red)',[['Hareket kabiliyeti düşük',10.64],['Uzun bekleme süreleri',12.38]]);
function introR(t){
  kb.forEach(([e,a,b],i)=>{const vis=t>=a&&t<b;e.style.display=vis?'':'none';if(!vis)return;const p=(t-a)/(b-a);
    e.style.opacity=Math.min(clamp((t-a)/.4),clamp((b-t)/.4)+ (i==2?1:0));e.style.transform=`scale(${1.06+.08*p}) translate(${(i%2?-1:1)*20*p}px,0)`});
  show(introTitle,t,.15,14.4,'up',.5);show(introTag,t,.5,14.4,'fade',.5);
  show(pros[0],t,1.9,14.4,'slideL');pros[1].forEach(([r,t0])=>show(r,t,t0,14.4,'slideL'));
  show(cons[0],t,10.46,14.4,'slideR');cons[1].forEach(([r,t0])=>show(r,t,t0,14.4,'slideR'));
}

/* ---------- ABILITY BADGES + CHIPS ---------- */
function badge(key,name,sub,icon,small){return h(`<div class="abs panel badge"><div class="key ${small?'small':''}">${key}</div><img src="${A}${icon}"><div class="txt"><div class="sub">${sub}</div><div class="nm">${name}</div></div></div>`)}
const badges=[
 [badge('P','Dövüşçü İnadı','PASİF','SettP.png',true),...T.passive],
 [badge('Q','Yapıştır','YETENEK · Q','SettQ.png'),...T.q],
 [badge('W','Balyoz Gibi','YETENEK · W','SettW.png'),...T.w],
 [badge('E','Surat Dağıtan','YETENEK · E','SettE.png'),...T.e],
 [badge('R','Yürek Hoplatan','ULTİ · R','SettR.png'),...T.r]];
const chipBox=h(`<div class="abs chips"></div>`);
const chipDefs=[
 // [text,color,t0,t1]
 ['Saldırı sıfırlama','gold',31.6,40.4],['Sonraki 2 saldırı: <b>+menzil +hasar</b>','gold',33.26,40.4],['Şampiyona koşarken <b>+hız</b>','gold',38.7,40.4],
 ['Aldığın hasar = <b>İnat</b>','gold',42.0,49.26],['Tüm İnat → <b>kalkan</b>','purple',48.2,58.68],['Koni hasarı İnat ile artar','gold',50.2,58.68],['Merkez = <b>gerçek hasar</b>','red',53.62,58.68],['Geç oyun: <b>tek atar</b>','red',57.44,58.68],
 ['Ön + arka, dikdörtgen','gold',59.4,67.9],['Hasar + yavaşlatma','gold',63.0,67.9],['İki taraftan çek = <b>SERSEMLET</b>','red',64.6,67.9],
 ['Hedefli: yakala, zıpla, <b>çak</b>','gold',68.6,83.48],['İndiği alana hasar + yavaşlatma','gold',73.54,83.48],['Hasar = hedefin <b>ekstra canı</b>','purple',77.64,83.48],['Tank yakala = <b>takım silinir</b>','red',79.94,83.48],
 // early game
 ['Bol farm, görevi erken bitir','gold',146.79,157.0],['Seviye 1\'de çok güçlüsün','green',151.07,157.0],
 ['Kitin = <b>trade</b> aramak','gold',157.23,177.6],['E: minyon + rakip → <b>SERSEMLET</b>','red',162.13,177.6],['2 bedava oto','gold',166.13,177.6],['Q + 2 oto + hareket hızı','gold',167.4,177.6],['W ile <b>bitir</b>','purple',172.89,177.6],
 ['E kaçtı mı? <b>Dikkatli oyna</b>','red',177.87,187.66],['Seviye 6: dalış güçlenir','green',180.55,187.66],['Kule altına çek, <b>çak</b>','gold',183.81,187.66],
 ['Kuleyi erken al','gold',188.65,194.63],['Split push ya da takım savaşı','gold',192.11,194.63],
 ['Hedef: <b>dev bir ulti</b>','gold',196.0,211.9],['Tankı yakala, arka hatta <b>çak</b>','purple',200.81,211.9],['E ile takımı sersemlet','red',203.6,211.9],['W ile <b>tek at</b>','red',205.6,211.9],['Fırsat yoksa: önden arkaya','green',208.87,211.9]
];
const chips=chipDefs.map(([tx,c,t0,t1])=>{const w=document.createElement('div');w.className='chipwrap';const e=h(`<div class="chip ${c}">${tx}</div>`);w.appendChild(e);chipBox.appendChild(w);return [w,e,t0,t1]});
// passive card (covers English tooltip)
const pcard=h(`<div class="abs panel pcard"><div class="hd"><img src="${A}SettP.png">DÖVÜŞÇÜ İNADI</div>
<div class="ln" id="pl1">Eksik canı arttıkça <b>can yenilenmesi artar</b>.</div>
<div class="ln" id="pl2">Sol yumruk: normal saldırı.</div>
<div class="ln" id="pl3">Sağ yumruk: <b>+menzil, +saldırı hızı, +hasar</b>.</div></div>`);
const pl=[1,2,3].map(i=>pcard.querySelector('#pl'+i));
// grit bar
const grit=h(`<div class="abs panel grit"><div class="lbl"><span>İNAT</span><span id="gv">0</span></div><div class="bar"><div class="fill" id="gf"></div></div></div>`);
const gf=grit.querySelector('#gf'),gv=grit.querySelector('#gv');

/* ---------- COMBO BAND ---------- */
const band=h(`<div class="abs band"><div class="ttl" id="bt"></div><div class="row" id="br"></div></div>`);
const bt=band.querySelector('#bt'),br=band.querySelector('#br');
const ic={Q:'SettQ.png',W:'SettW.png',E:'SettE.png',R:'SettR.png'};
function comboRow(steps){br.innerHTML='';const els=[];steps.forEach(([k,t0],i)=>{if(i)br.insertAdjacentHTML('beforeend','<div class="arrow">›</div>');
  let e; if(ic[k]){e=h(`<div class="step"><img src="${A}${ic[k]}"><div class="k">${k}</div></div>`)} else {e=h(`<div class="step auto">${k}</div>`)}
  br.appendChild(e);els.push([e,t0])});return els}
const combo1=[['E',85.38],['2 OTO',86.24],['Q',87.36],['2 OTO',88.66],['R',90.24],['2 OTO',91.18],['W',92.04]];
const combo2=[['R',93.5],['E',94.6],['2 OTO',95.22],['Q',96.06],['OTO',96.62],['W',97.46]];
let curCombo=0,comboEls=[];

/* ---------- FULL SCENES ---------- */
function scene(bgimg){const s=h(`<div class="abs scene"><div class="bg" style="background-image:url(${A}${bgimg})"></div></div>`);return s}
// matchups
const sm=scene('splash_0.jpg');add(sm,...T.match,'fade');
sm.insertAdjacentHTML('beforeend',`<div class="title">EŞLEŞ<span>MELER</span></div>
<div class="abs" style="left:660px;top:200px;width:600px;height:760px;background:url(${A}splash_0.jpg) 58% 30%/auto 130%;border-radius:26px;box-shadow:0 0 0 4px rgba(244,185,66,.5)"></div>`);
const sEasy=h(`<div class="side" style="left:70px;background:linear-gradient(180deg,rgba(30,120,70,.92),rgba(12,50,30,.92))"><h2>KOLAY</h2><div class="icons"><img src="${A}champ_Yasuo.png"><img src="${A}champ_Yone.png"><img src="${A}champ_Riven.png"></div><div class="cap">Yüksek hasar, düşük dayanıklılık.</div><div class="cap" style="color:#d9ffe9">Sana bol İnat verir, tek atarsın.</div></div>`);
const sHard=h(`<div class="side" style="left:1290px;background:linear-gradient(180deg,rgba(150,30,45,.92),rgba(60,10,18,.92))"><h2>ZOR</h2><div class="icons"><img src="${A}champ_Vayne.png"><img src="${A}champ_Quinn.png"><img src="${A}champ_Teemo.png"></div><div class="cap">Uzaktan kite atanlar.</div><div class="cap" style="color:#ffd9dd">Alan kontrolüyle seni uzak tutanlar.</div></div>`);
sm.appendChild(sEasy);sm.appendChild(sHard);
// runes
const sr=scene('splash_56.jpg');add(sr,...T.runes,'fade');
sr.insertAdjacentHTML('beforeend',`<div class="title">RÜN<span>LER</span></div>
<div class="tag" style="left:250px;top:215px"><img src="${A}rune_7201_Precision.png" style="width:44px;vertical-align:middle;margin-right:12px">İSABET</div>
<div class="tag" style="left:1260px;top:215px"><img src="${A}rune_7204_Resolve.png" style="width:44px;vertical-align:middle;margin-right:12px">AZİM</div>`);
function rcard(parent,x,y,img,name,big){const c=h(`<div class="card ${big?'lg':''}" style="left:${x}px;top:${y}px"><img src="${A}${img}" style="border-radius:50%;background:#140d22"><div class="n">${name}</div></div>`);parent.appendChild(c);return c}
const runeCards=[[rcard(sr,150,300,'rune_Conqueror.png','Conqueror',1),111.26],[rcard(sr,440,320,'rune_Triumph.png','Triumph'),112.06],[rcard(sr,690,320,'rune_LegendAlacrity.png','Legend: Alacrity'),112.88],[rcard(sr,440,600,'rune_LastStand.png','Last Stand'),114.62],
 [rcard(sr,1180,320,'rune_SecondWind.png','Second Wind'),116.5],[rcard(sr,1450,320,'rune_Unflinching.png','Unflinching'),117.4]];
const shards=h(`<div class="abs" style="left:1130px;top:640px;width:700px"></div>`);sr.appendChild(shards);
const shardEls=['Saldırı hızı','Uyarlanabilir güç','Ölçeklenen can'].map((s,i)=>{const w=document.createElement('div');w.className='chipwrap';const e=h(`<div class="chip purple" style="font-size:34px">${s}</div>`);w.appendChild(e);shards.appendChild(w);return [e,117.9+i*.25]});
const conqGlow=h(`<div class="abs chip red" style="left:120px;top:880px;font-size:40px">Conqueror'ı <b>çok kolay doldurur</b></div>`);sr.appendChild(conqGlow);
// items
const si=scene('splash_66.jpg');add(si,...T.items,'fade');
si.insertAdjacentHTML('beforeend',`<div class="title">EŞYA<span>LAR</span></div>`);

    [...sHard.querySelectorAll('.cap')].forEach((e,i)=>e.style.opacity=t>=(i?100.6:99.8)?1:0);[...sEasy.querySelectorAll('.cap')].forEach((e,i)=>e.style.opacity=t>=(i?107.12:104.3)?1:0);}
  if(inS(t,'runes')){runeCards.forEach(([c,t0])=>show(c,t,t0,120.4,'pop'));shardEls.forEach(([e,t0])=>show(e,t,t0,120.4,'slideR'));show(conqGlow,t,118.48,120.4,'up');

  if(inS(t,'items')){itemCards.forEach(([c,t0])=>show(c,t,t0,131.95,'pop'));itemArrows.forEach(([a,t0])=>show(a,t,t0,131.95,'fade'))}
  if(inS(t,'skills')){cells.forEach(c=>{const l=+c.dataset.l;const on=t>=lvlT[l];c.classList.toggle('on',on);c.classList.toggle('r',c.dataset.k==='R');c.textContent=on?c.dataset.k:'';
