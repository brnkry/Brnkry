<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>

</style></head><body>
<div class="t" id="yone">
 <div class="p" style="left:0;width:1280px;background-image:url(assets/thumb/yone_ikiyuz_v.jpg);background-size:1280px 720px;filter:contrast(1.12) saturate(1.15) brightness(1.15)"></div>

 <div id="petals"></div>
 <div style="position:absolute;left:46px;top:44px;padding:6px 18px 8px;background:#C4213A;box-shadow:0 6px 18px rgba(0,0,0,.7)"><div class="a" style="font-size:42px;color:#fff;filter:none">BÖLÜM 2</div></div>
 <div style="position:absolute;left:46px;top:140px">
  <div class="a" style="font-size:84px;color:#F7EFE2">ÖLÜM BİR</div>

<script>
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;let h='';
for(let i=0;i<34;i++){const x=r()*1280,y=r()*720,w=14+r()*30,b=r()<.35?(2+r()*5):0,o=.55+r()*.4;
 if(x>30&&x<600&&y>120&&y<700&&r()<.85)continue;
 h+=`<div class="pt" style="left:${x}px;top:${y}px;width:${w}px;height:${w*.62}px;transform:rotate(${r()*360}deg);filter:blur(${b}px) drop-shadow(0 0 6px rgba(255,80,140,.6));opacity:${o}"></div>`}
