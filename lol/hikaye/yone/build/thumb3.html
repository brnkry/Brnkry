<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
@font-face{font-family:Cz;font-weight:700;src:url(node_modules/@fontsource/cinzel/files/cinzel-latin-ext-700-normal.woff2)}
@font-face{font-family:Cz;font-weight:700;src:url(node_modules/@fontsource/cinzel/files/cinzel-latin-700-normal.woff2);unicode-range:U+0000-00FF}
html,body{margin:0;background:#000}
.t{position:relative;width:1280px;height:720px;overflow:hidden;background:#07060a;margin-bottom:10px}
.L{position:absolute;inset:0;background-repeat:no-repeat}
.y{font-family:Cz;font-weight:700;white-space:nowrap;line-height:1.14;-webkit-text-stroke:1.5px currentColor;letter-spacing:-.035em;filter:drop-shadow(0 4px 0 rgba(0,0,0,.9)) drop-shadow(0 0 18px rgba(0,0,0,.95)) drop-shadow(0 0 40px rgba(0,0,0,.7))}
.pt{position:absolute;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#ffd1e3,#ff7aa8 55%,#d23a6a)}
</style></head><body>
<!-- Part 2: splash background, one face split old / masked -->
<div class="t" id="yone">
 <div class="L" style="background-image:url(../kaynak/resmi_gorseller/yone_varsayilan_splash.jpg);background-size:1400px auto;background-position:-120px -40px;filter:blur(2px) brightness(.55) saturate(1.1)"></div>
 <div class="L" style="background:linear-gradient(90deg,rgba(7,6,10,.92) 0%,rgba(7,6,10,.7) 38%,rgba(7,6,10,.15) 62%,rgba(7,6,10,.35) 100%)"></div>
 <div class="L" style="background-image:url(assets/thumb/yone_ikiyuz_v.png);background-size:1280px 720px;filter:contrast(1.12) saturate(1.15) brightness(1.2)"></div>
 <div class="L" style="background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)"></div>
 <div class="petals"></div>
 <div style="position:absolute;left:44px;top:170px">
  <div class="y" style="font-size:80px;color:#F7EFE2">YONE'NİN ÖLÜMÜ</div>
  <div class="y" style="font-size:80px;color:#FF3B4E">BİR SON DEĞİLDİ</div>
 </div>
 <div style="position:absolute;left:44px;top:368px">
  <div style="width:110px;height:5px;background:#F6C65B;box-shadow:0 0 12px #000;margin-bottom:16px"></div>
  <div class="y" style="font-size:92px;color:#F6C65B">YONE'NİN</div>
  <div class="y" style="font-size:92px;color:#F6C65B">HİKAYESİ</div>
 </div>
</div>
<!-- Part 1 option A: Yasuo vs Yone artwork -->
<div class="t" id="yasuo_a">
 <div class="L" style="background-image:url(../../yasuo/build/thumb2/yvy.jpg);background-size:1300px auto;background-position:-10px -10px;filter:contrast(1.1) saturate(1.1)"></div>
 <div class="L" style="background:linear-gradient(0deg,rgba(7,6,10,.95) 0%,rgba(7,6,10,.6) 28%,rgba(7,6,10,0) 50%)"></div>
 <div class="petals"></div>
 <div style="position:absolute;left:0;right:0;top:445px;text-align:center">
  <div class="y" style="font-size:58px;color:#F7EFE2">ABİSİNİ ÖLDÜRDÜ, AMA SUÇSUZDU</div>
  <div class="y" style="font-size:104px;color:#F6C65B">YASUO'NUN HİKAYESİ</div>
 </div>
</div>
<!-- Part 1 option B: Yasuo in front, the masked brother behind him -->
<div class="t" id="yasuo_b">
 <div class="L" style="background-image:url(assets/thumb/yone_maske.jpg);background-size:1700px auto;background-position:-560px -200px;filter:brightness(.5) saturate(1.3) blur(1px)"></div>
 <div class="L" style="background:linear-gradient(90deg,rgba(7,6,10,.0) 0%,rgba(7,6,10,.35) 40%,rgba(7,6,10,.9) 62%)"></div>
 <div style="position:absolute;left:560px;top:0;width:720px;height:720px;background-image:url(assets/thumb/yasuo_yuz.jpg);background-size:1500px auto;background-position:-760px -60px;filter:contrast(1.12) brightness(1.15);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%),linear-gradient(0deg,transparent 0%,#000 20%);-webkit-mask-composite:source-in"></div>
 <div class="L" style="background:linear-gradient(0deg,rgba(7,6,10,.9) 0%,rgba(7,6,10,0) 35%)"></div>
 <div class="petals"></div>
 <div style="position:absolute;left:40px;top:170px">
  <div class="y" style="font-size:72px;color:#F7EFE2">ABİSİNİ ÖLDÜRDÜ</div>
  <div class="y" style="font-size:72px;color:#FF3B4E">AMA SUÇSUZDU</div>
 </div>
 <div style="position:absolute;left:40px;top:368px">
  <div style="width:110px;height:5px;background:#F6C65B;box-shadow:0 0 12px #000;margin-bottom:16px"></div>
  <div class="y" style="font-size:92px;color:#F6C65B">YASUO'NUN</div>
  <div class="y" style="font-size:92px;color:#F6C65B">HİKAYESİ</div>
 </div>
</div>
<script>
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;let h='';
for(let i=0;i<30;i++){const x=r()*1280,y=r()*720,w=14+r()*30,b=r()<.35?(2+r()*5):0,o=.55+r()*.4;
 h+=`<div class="pt" style="left:${x}px;top:${y}px;width:${w}px;height:${w*.62}px;transform:rotate(${r()*360}deg);filter:blur(${b}px) drop-shadow(0 0 6px rgba(255,80,140,.6));opacity:${o}"></div>`}
document.querySelectorAll('.petals').forEach(e=>e.innerHTML=h);
window.ready=document.fonts.load('700 100px Cz','AİŞĞÖÜÇ');
</script></body></html>
