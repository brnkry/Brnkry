<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
@font-face{font-family:PB;src:url(assets/punkboy_bi.otf)}
@font-face{font-family:Mon;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;background:transparent;overflow:hidden}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:PB;color:#F4EFE6}
.ab{position:absolute}
:root{--lime:#D4FF3A;--red:#FF3B5C;--paper:#F4EFE6;--ink:#0B0B0F}
/* Turkish letters the font lacks, built from its own pieces */
.ti{position:relative;display:inline-block;line-height:.9}
.ti.dot:after{content:'';position:absolute;left:54%;bottom:1.0em;width:.19em;height:.16em;background:currentColor;border-radius:40% 55% 45% 50%;transform:translateX(-50%) rotate(-12deg)}
.ti.brv:after{content:'';position:absolute;left:54%;bottom:.92em;width:.4em;height:.17em;border:.1em solid currentColor;border-top:0;border-radius:0 0 .3em .3em;transform:translateX(-50%) rotate(-8deg)}
.ti.ced:after{content:'Ç';position:absolute;left:0;right:0;top:0;text-align:center;clip-path:inset(86% -20% -80% -20%);transform:translateX(-.02em)}
.ti.pd{width:.24em;height:.8em}.ti.pd:after{content:'';position:absolute;left:.08em;bottom:.04em;width:.17em;height:.16em;background:currentColor;border-radius:45% 55% 50% 40%;transform:rotate(-10deg)}
.pc{font-family:Mon;font-weight:900;font-size:.78em;margin-right:.04em}

.ti.crc:after{content:'';position:absolute;left:52%;bottom:1.0em;width:.18em;height:.18em;border-left:.065em solid currentColor;border-top:.065em solid currentColor;transform:translateX(-50%) rotate(45deg)}
@font-face{font-family:Mon;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2')}
.paper{background:#F4EFE6;color:#0B0B0F;clip-path:polygon(0 3%,4% 0,12% 2%,22% .4%,33% 2.4%,45% .3%,57% 2%,68% .2%,80% 2.2%,91% .4%,100% 1.5%,100% 97%,93% 100%,82% 98%,70% 99.8%,58% 97.8%,46% 100%,34% 98%,22% 99.6%,11% 97.6%,0 99.4%)}
.sh{filter:drop-shadow(0 14px 24px rgba(0,0,0,.55))}
.ic{display:block;border:5px solid #0B0B0F}
.lime{background:#D4FF3A;color:#0B0B0F}
.big{position:absolute;left:0;right:0;text-align:center;line-height:1.1}
.tile{display:inline-flex;flex-direction:column;align-items:center;margin:0 8px;vertical-align:top}
.tile img{width:96px;height:96px;border:5px solid #0B0B0F}
.tile .k{font-size:34px;line-height:1.2;margin-top:4px}
.pill{display:inline-block;line-height:1.25;padding:.3em 12px 0;font-size:24px;margin:0 4px;box-shadow:5px 6px 0 rgba(0,0,0,.4)}
.stamp{display:inline-block;font-size:54px;line-height:1.25;padding:.3em 16px 2px;border:6px solid currentColor;border-radius:10px;background:rgba(244,239,230,.94)}
.blk{background:#0B0B0F;color:#F4EFE6}
@font-face{font-family:Cin;font-weight:900;src:url(node_modules/@fontsource/cinzel/files/cinzel-latin-ext-900-normal.woff2) format('woff2');unicode-range:U+0100-024F,U+0130-0131,U+015E-015F,U+011E-011F}
@font-face{font-family:Cin;font-weight:900;src:url(node_modules/@fontsource/cinzel/files/cinzel-latin-900-normal.woff2) format('woff2')}
.gold{font-family:Cin;font-weight:900;color:#E9C46A;-webkit-text-stroke:3px #3A2608;paint-order:stroke fill;text-shadow:0 8px 0 #2A1A04,0 0 50px rgba(0,0,0,.9)}
.pnl{position:absolute;width:800px;height:450px;border:8px solid #D4FF3A;box-shadow:14px 16px 0 rgba(0,0,0,.6)}
</style></head><body><div id="root" style="width:1920px;height:1080px;font-family:PB"><div id="dyn"></div></div>
<script src="timeline.js"></script><script>
const tr=s=>String(s).replace(/Â/g,'<span class="ti crc">A</span>').replace(/İ/g,'<span class="ti dot">I</span>').replace(/Ğ/g,'<span class="ti brv">G</span>').replace(/Ş/g,'<span class="ti ced">S</span>').replace(/\./g,'<span class="ti pd">&#8203;</span>').replace(/%/g,'<span class="pc">%</span>');
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,prog=(t,a,d)=>cl((t-a)/d);
const eo=k=>1-Math.pow(1-cl(k),3),eb=k=>{k=cl(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const env=(t,a,b,fi=.25,fo=.25)=>t<a||t>b?0:Math.min(eb(prog(t,a,fi)),1-prog(t,b-fo,fo));
const pop=(t,a,d=.3)=>`opacity:${cl(prog(t,a,d)*3)};transform:scale(${lerp(.4,1,eb(prog(t,a,d)))})`;

const SECS=['GİRİŞ','YENİ BAŞLANGIÇ','DERECELİ','RÜNLER','EŞYALAR','HARİTA','ARAM','SON'];
const CUR=0;
function topbar(t,a){if(t<a)return '';const k=prog(t,a,.45);
 let h=`<div class="ab" style="left:0;right:0;top:0;height:145px;transform:translateY(${(1-eo(k))*-170}px)"><div class="ab" style="left:0;right:0;top:0;height:175px;background:linear-gradient(180deg,#0B0B0F 0,#0B0B0F 88%,rgba(11,11,15,0))"></div><div class="ab paper sh" style="left:24px;top:14px;padding:8px 22px 4px;transform:rotate(-2deg)"><div style="font-size:20px;letter-spacing:.12em;opacity:.7">LOL <span style="font-family:Mon;font-weight:900">2027</span></div><div style="font-size:36px;line-height:1.05">${tr('NELER GELİYOR?')}</div></div><div class="ab" style="left:350px;top:36px;white-space:nowrap">`;
 SECS.forEach((s,i)=>{const on=i===CUR,past=i<CUR;h+=`<span class="pill" style="background:${on?'#D4FF3A':past?'#5a5a60':'#F4EFE6'};color:${past?'#cfcfcf':'#0B0B0F'};transform:rotate(${i%2?2:-2}deg) scale(${on?1.18:1});font-size:${on?32:25}px">${tr(s)}</span>`});
 return h+`</div><div class="ab" style="right:24px;top:30px;font-size:30px;letter-spacing:.06em;padding:4px 16px 2px;background:rgba(11,11,15,.78);border-radius:8px;color:#F4EFE6">FEEDLEME HOCAM</div></div>`}
function slam(t,a,b,txt,y,fs,bg,fg,rot){const k=prog(t,a,.22),o=1-prog(t,b-.15,.15);if(t<a||o<=0)return '';return `<div class="big" style="top:${y}px;opacity:${cl(k*3)*o};transform:rotate(${rot}deg) scale(${lerp(1.8,1,eb(k))})"><span class="sh" style="display:inline-block;font-size:${fs}px;line-height:1.25;padding:.32em 40px .02em;background:${bg};color:${fg};box-shadow:12px 14px 0 rgba(0,0,0,.55)">${tr(txt)}</span></div>`}
window.render=function(t){let O='';
 // brand tag before the top bar shows up
 if(t<18.3)O+=`<div class="ab" style="right:24px;top:30px;font-size:30px;letter-spacing:.06em;padding:4px 16px 2px;background:rgba(11,11,15,.78);border-radius:8px">FEEDLEME HOCAM</div>`;
 // 0) 2027 + logo, "olmayacak" shakes the logo
 if(t<3.6){const A=1-prog(t,3.35,.2),sh=t>=2.62&&t<3.0?Math.sin(t*140)*16*(1-prog(t,2.62,.38)):0,gr=prog(t,2.62,.3);
  O+=`<div class="ab gold" style="left:0;right:0;top:120px;text-align:center;font-size:330px;line-height:1;opacity:${cl(prog(t,.05,.08)*4)*A};transform:scale(${lerp(3,1,eo(prog(t,.05,.2)))})">2027</div>`;
  if(t>=.84)O+=`<div class="ab" style="left:560px;width:800px;top:520px;opacity:${cl(prog(t,.84,.2)*3)*A};transform:translate(${sh}px,${sh*.4}px) scale(${lerp(1.2,1,eo(prog(t,.84,.3)))})"><img src="assets/lol_logo.png" style="width:800px;display:block;filter:grayscale(${gr}) brightness(${1-.35*gr}) drop-shadow(0 10px 30px rgba(0,0,0,.9))"></div>`;
  if(t>=2.62)O+=slam(t,2.62,3.5,'BUGÜNKÜ LOL OLMAYACAK',880,64,'#FF3B5C','#F4EFE6',-2)}
 // 1) ranks drop to Iron IV
 if(t>=3.5&&t<4.75){const A=1-prog(t,4.55,.2);[['challenger',560],['master',960],['gold',1360]].forEach(([r,x],i)=>{const d=prog(t,3.88+i*.06,.35);O+=`<img src="assets/emblem_${r}.png" style="position:absolute;left:${x-150}px;top:${300+eo(d)*500}px;width:300px;opacity:${cl(prog(t,3.5+i*.05,.12)*3)*(1-d)*A};transform:rotate(${d*30*(i-1)}deg)">`});
  if(t>=3.95){const k=prog(t,3.95,.22);O+=`<img src="assets/emblem_iron.png" style="position:absolute;left:700px;top:190px;width:520px;opacity:${cl(k*3)*A};transform:scale(${lerp(2.4,1,eo(k))});filter:drop-shadow(0 12px 30px rgba(0,0,0,.8))">`;O+=slam(t,3.95,4.75,'DEMİR IV',540,100,'#F4EFE6','#0B0B0F',-3)}
  O+=slam(t,3.52,4.75,'DERECEN SIFIRLANIYOR',830,60,'#FF3B5C','#F4EFE6',2)}
 O+=slam(t,4.74,5.7,'HARİTA DEĞİŞİYOR',800,80,'#D4FF3A','#0B0B0F',-3);
 O+=slam(t,5.68,6.98,'EŞYALAR DEĞİŞİYOR',800,80,'#D4FF3A','#0B0B0F',2);
 O+=slam(t,6.96,9.4,'ŞAMPİYON SEÇİMİ BİLE!',800,80,'#FF3B5C','#F4EFE6',-2);
 // 2) two videos
 if(t>=9.4&&t<13.7){const A=1-prog(t,13.45,.2);
  O+=slam(t,9.42,13.65,'RİOT 2 VİDEO YAYINLADI',170,64,'#F4EFE6','#0B0B0F',-2);
  [[120,'YENİ BAŞLANGIÇ',9.6],[1000,'SEZON 2027: GELİŞTİRİCİLER',9.9]].forEach(([x,lab,a])=>{const k=prog(t,a,.3);
   O+=`<div class="pnl" style="left:${x-8}px;top:322px;opacity:${cl(k*3)*A}"></div><div class="ab" style="left:${x}px;width:800px;top:800px;text-align:center;opacity:${cl(k*3)*A}"><span class="pill lime" style="font-size:46px;transform:rotate(-2deg)">${tr(lab)}</span></div>`});
  if(t>=12.42)[[520,0],[1400,.12]].forEach(([cx,d])=>{const k=prog(t,12.42+d,.2);O+=`<div class="ab" style="left:${cx-200}px;width:400px;top:470px;text-align:center;opacity:${cl(k*4)*A}"><span class="stamp" style="font-size:64px;color:#3a9b00;transform:rotate(-10deg) scale(${lerp(2.6,1,eo(k))})">${tr('İNCELENDİ')}</span></div>`})}
 // 3) chapter list, then it moves up into the top bar
 if(t>=13.6&&t<18.5){const A=1-prog(t,18.1,.25);O+=slam(t,13.66,18.4,'BU VİDEODA',150,64,'#D4FF3A','#0B0B0F',-2);
  SECS.forEach((s,i)=>{const a=14.9+i*.36,k=prog(t,a,.25),col=i%2,row=Math.floor(i/2);if(t<a)return;
   O+=`<div class="ab" style="left:${col?1010:300}px;top:${300+row*165}px;opacity:${cl(k*3)*A};transform:translateX(${(1-eo(k))*(col?120:-120)}px) translateY(${-lerp(0,260,eo(prog(t,18.1,.3)))}px) rotate(${i%2?1.5:-1.5}deg)"><span class="pill" style="font-size:84px;background:${i?'#F4EFE6':'#D4FF3A'};color:#0B0B0F;box-shadow:10px 12px 0 rgba(0,0,0,.55)"><span style="font-family:Mon;font-weight:900;font-size:.7em;margin-right:16px;opacity:.6">${i+1}</span>${tr(s)}</span></div>`})}
 O+=topbar(t,18.3);
 // 4) the biggest change, at the end of the video
 if(t>=18.62){const k=prog(t,18.62,.3);
  O+=`<div class="ab" style="left:0;right:0;top:250px;text-align:center;opacity:${cl(k*3)}"><span class="paper sh" style="display:inline-block;font-size:62px;line-height:1.25;padding:.32em 40px .1em;transform:rotate(-2deg)">${tr('EN BÜYÜK DEĞİŞİKLİK')}</span></div>`;
  O+=`<div class="ab" style="left:0;right:0;top:390px;text-align:center;font-family:Mon;font-weight:900;font-size:420px;line-height:1;color:#D4FF3A;-webkit-text-stroke:10px #0B0B0F;paint-order:stroke fill;text-shadow:0 0 60px rgba(212,255,58,.5);opacity:${cl(prog(t,19.96,.15)*3)};transform:scale(${lerp(2.5,1,eo(prog(t,19.96,.25)))*(1+.04*Math.sin(t*6))})">?</div>`;
  if(t>=21.28)O+=`<div class="ab" style="left:1240px;top:640px;"><span class="stamp" style="font-size:80px;color:#FF3B5C;transform:rotate(-12deg) scale(${lerp(2.6,1,eo(prog(t,21.28,.22)))})">SONDA!</span></div>`}
 document.getElementById('dyn').innerHTML=O};
window.SFX=[['impact',.05,0],['pop',.84,-2],['stamp_dan',2.62,-2],['card',3.52,0],['impact',3.95,-6],['yazi_vurus',4.74,0],['yazi_vurus',5.68,0],['yazi_vurus',6.96,0],
 ['yazi_vurus',9.42,0],['card',9.6,-2],['card',9.9,-2],['stamp_dan',12.42,0],['stamp_dan',12.54,-4],['yazi_vurus',13.66,0],
 ...[0,1,2,3,4,5,6,7].map(i=>['pop',14.9+i*.36,-3]),['card',18.3,0],['yazi_vurus',18.62,0],['impact',19.96,-8],['stamp_dan',21.28,0]];
window.ready=document.fonts.ready;
</script></body></html>
